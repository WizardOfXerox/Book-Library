<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Description Page</title>
    <link rel="stylesheet" href="../book.css" />
</head>

<body>

    <div class="book-container">

        <div class="book-main">
            <div class="book-cover">
                <img src="../../Images/BOOKCOVER/9.png" alt="Book Cover">
            </div>
            <div class="book-description">
                <h2>The Nameless Thieves</h2>
                <p>
                    Ghosts in the night. Masters of disguise. The Nameless Thieves leave no trace, taking everything in their path. In a world of shadows and high stakes, they are the ultimate challenge. Experience the pulse-pounding thrill of the chase in this action-packed
                    adventure.
                </p>
            </div>
        </div>

        <div class="search-panel">
            <input type="text" placeholder="Search inside the book...">
            <button>Search</button>
        </div>

        <div class="chapters">
            <h3>Chapters</h3>
            <div class="chapter-grid">
                <!-- <a href="#" class="chapter-box" data-chapter="1">
                    Chapter 12
                    <small>Introduction to the story</small>
                </a> -->
                <!-- Chapters loaded by JS -->
            </div>
        </div>

    </div>

    <script type="module" src="loadChapters.js"></script>
</body>

</html>
