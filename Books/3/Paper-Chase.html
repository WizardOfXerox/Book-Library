<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Description Page</title>
    <link rel="stylesheet" href="../book.css" />
</head>

<body>

    <div class="book-container">

        <div class="book-main">
            <div class="book-cover">
                <img src="../../Images/BOOKCOVER/3.png" alt="Book Cover">
            </div>
            <div class="book-description">
                <h2>Paper Chase</h2>
                <p>
                    In a world driven by greed, one man will stop at nothing to amass a fortune. "Paper Chase" follows his descent into a morally bankrupt existence, where the pursuit of wealth justifies any means, no matter how illegal.
                </p>
            </div>
        </div>

        <div class="search-panel">
            <input type="text" placeholder="Search inside the book...">
            <button>Search</button>
        </div>

        <div class="chapters">
            <h3>Chapters</h3>
            <div class="chapter-grid">
                <!-- <a href="#" class="chapter-box" data-chapter="1">
                    Chapter 1
                    <small>Introduction to the story</small>
                </a> -->
                <!-- Chapters loaded by JS -->
            </div>
        </div>

    </div>

    <script type="module" src="loadChapters.js"></script>
</body>

</html>
