"Nurse station... check."
Ang boses ni Nurse Catherine.
"Supply closet..."
Huminto ang mga footsteps sa labas ng closet. Ang doorknob ay unti-unting gumalaw.
Jeffrey at Bryan ay nag-hold ng breath, nagtakip ng bibig para hindi marinig ang kanilang mga paghinga.
Ang doorknob ay tumunog pa ng ilang segundo, tapos tumigil.
"Supply closet... secured."
Narinig nila ang mga footsteps na naglalakad palayo mula sa closet, patungo sa ibang direction ng corridor.
Pero hindi pa rin sila lumabas. May instinct si Jeffrey na hindi pa safe lumabas ng closet.
At tama siya.
Pagkatapos ng ilang minuto, narinig nila ulit ang intercom system.
"Attention Jeffrey Martinez and Bryan Martinez. Your presence is required at the basement level. Please report immediately for the completion of tonight's procedure."
Ang boses sa intercom ay hindi na ang unknown voice mula kanina. Ang boses ngayon ay familiar – si Dr. Jacquelyn.
Pero ang tone niya ay kakaiba. Monotone, walang emotion, parang ang mga boses ng pasyente at ni Nurse Catherine kanina.
"Jeffrey Martinez and Bryan Martinez. You have five minutes to report to the basement level. Failure to comply will result in immediate collection."
"Collection?" bulong ni Bryan. "Ano ang ibig sabihin ng collection?"
Hindi sumagot si Jeffrey. Pero sa loob-loob niya, alam niya na ang "collection" ay hindi magandang bagay.
Narinig nila ulit ang mga footsteps sa corridor, pero ngayon ay mas marami pa. Parang ang buong population ng second floor ay naglalakad sa labas ng closet.
At sa basement, ang chanting ay naging mas malakas, mas urgent.
Parang may deadline na dapat ma-meet.
Parang may ritual na dapat ma-complete bago mag-sunrise.
At sila ni Bryan ay ang missing pieces para ma-complete ang ritual na 'yun.

CHAPTER 3: ANG HULING DALAWANG TAO
Alas-onse y-medya ng gabi, dalawang oras bago ang sunrise
Sa loob ng supply closet, Jeffrey at Bryan ay nanatiling nakatago, nakikinig sa mga kakaibang tunog na nanggagaling sa buong Blackwood building. Ang chanting sa basement ay hindi tumitigil, at ang mga footsteps sa corridors ay patuloy na naglilibot, parang mga sentinel na naghahanap sa kanila.
"Pre," bulong ni Bryan sa tenga ni Jeffrey, "ilang oras na ba tayong nakatago dito?"
Tiningnan ni Jeffrey ang kanyang wristwatch. Ang green glow ng digital display ay nagpapakita ng 11:37 PM.
"Mahigit isang oras na," sagot niya. "Pero parang hindi tumigil ang mga activities sa labas."
Sa ventilation grate sa itaas ng closet, narinig nila ang mga bagong tunog. Hindi na lang mga footsteps at chanting. May mga kakaibang sounds na parang... parang mga mechanical noises, parang may mga makina na ginagamit sa basement.
Whirrrr... clank... whirrrr... clank...
"Ano 'yun?" tanong ni Bryan.
Bago pa makasagot si Jeffrey, tumunog ulit ang intercom system. Pero ngayon, ang boses ay mas distorted na, parang nanggagaling sa malayong lugar o kaya naman parang filtered through multiple layers ng interference.
"Jeffrey Martinez... Bryan Martinez..."
Ang boses ay hindi na si Dr. Jacquelyn. Ang boses ngayon ay combination ng maraming boses – pasyente, staff, at iba pang hindi nila makilala.
"The time for compliance has expired. Collection protocols are now in effect. Remain in your current location. The collectors are being dispatched."
Pagkatapos ng announcement, narinig nila ang mga bagong footsteps sa corridor. Pero ang mga footsteps na ito ay kakaiba sa mga narinig nila kanina. Mas mabigat, mas mabagal, at may kasamang dragging sound, parang may mga bagay na hinahila sa floor.
Thud... drag... thud... drag...
"Collectors?" bulong ni Bryan, ang takot ay halata na sa boses niya. "Sino ang mga collectors?"
Sa maliit na gap sa ilalim ng closet door, nakita nila ang mga shadows na dumadaan sa corridor. Pero ang mga shadows ay hindi normal human shapes. Mas matangkad, mas malawak, at may mga extra appendages na hindi nila matukoy kung ano.
Ang dragging sound ay mas malapit na. Paparating na sa direction ng supply closet.
"Kailangan natin lumabas dito," bulong ni Jeffrey. "Pero hindi sa corridor. Baka may ibang way."
Tiningnan nila ang ventilation grate sa itaas. Malaki ang opening, pwede silang makasama doon. Pero hindi nila alam kung saan connected ang ventilation system, at baka mas delikado pa sa loob.
Ang dragging sound ay tumigil sa labas ng closet door.
Jeffrey at Bryan ay nag-hold ng breath ulit, nagtakip ng bibig, at nagtry na maging kasing-tahimik ng possible.
Ang doorknob ay nagsimulang gumalaw ulit. Pero ngayon, ang pagkakabukas ay mas mabagal, mas deliberate. Parang ang nasa labas ay alam na nandoon sila sa loob.
Click... click... click...
Ang sound ng doorknob ay parang combination lock na binubuksan slowly.
"Pre," bulong ni Bryan sa tenga ni Jeffrey, "kapag bumukas 'yang pinto, takbo tayo sa ventilation shaft."
Tumango si Jeffrey, naghanda na para sa escape plan.
Pero bago pa nila ma-execute ang plan, narinig nila ang tunog na magbabago sa lahat.
Ang tunog ng sirena.
Hindi fire alarm. Hindi emergency siren. Ang tunog na ito ay mas malalim, mas ominous, parang air raid siren ng World War 2.
At kasama ng sirena, narinig nila ang pinakanakakatakot na tunog sa buong gabi.
Ang tunog ng mga sigaw.
Hindi sigaw ng takot. Hindi sigaw ng sakit. Ang mga sigaw na ito ay... parang sigaw ng ecstasy, ng overwhelming joy, ng fanatical celebration.
Maraming boses na nagsisigawan ng sabay-sabay, mula sa lahat ng floors ng building.
"IT HAS BEGUN! IT HAS BEGUN! THE VESSEL IS READY!"
Ang mga sigaw ay nasa mixture ng English at ibang language na hindi nila makilala. Pero ang emotion sa mga boses ay unmistakable – pure euphoria, parang mga taong naging witness sa isang miracle.
Ang doorknob sa closet ay tumitigil na sa pagkakabukas. Ang collector na nasa labas ay parang naging distracted sa mga sigawan.
"Jeffrey," bulong ni Bryan, "ano ang ibig sabihin ng 'the vessel is ready'?"
Bago pa makasagot si Jeffrey, narinig nila ang footsteps ng collector na tumakbo palayo mula sa closet, pabalik sa direction ng stairwell.
Lahat ng collectors ay parang tinawag balik sa basement.
"Ngayon," sabi ni Jeffrey. "Ngayon tayo lalabas."
Binuksan nila nang dahan-dahan ang closet door. Ang second floor corridor ay empty na, pero ang mga ilaw ay nag-flicker pa rin, at ang mga shadows sa mga dingding ay gumagalaw pa rin kahit walang tao.
Tumakbo sila patungo sa stairwell, pero hindi sila bumaba. Sa halip, umakyat sila sa third floor. Ang plan ni Jeffrey ay pumunta sa office ni Dr. Jacquelyn, gamitin ang emergency phone doon para tumawag sa outside help.
Pero nang makarating sila sa third floor, nakita nila ang pinakakakaibang scene sa buong gabi.
Ang lahat ng patient room doors ay nakabukas. Lahat ng mga rooms ay empty. Pero sa gitna ng corridor, may isang malakiang circle na nakadraw sa floor gamit ang red substance na mukhang dugo.
At sa gitna ng circle, may nakaupo na isang figure.
Isang babae, nakaupo sa lotus position, ang mga mata ay nakapikit, ang mga kamay ay nakaupward sa mga tuhod. Ang kanyang buhok ay mahaba at nakasabay sa hangin kahit walang airflow sa corridor.
Ang babae ay naka-hospital gown, pero ang gown ay puti at malinis, walang stains o kaya naman damage.
"Sino 'yun?" bulong ni Bryan.
Lumapit sila nang dahan-dahan sa figure. At nang makita nila ang mukha ng babae, napaatras sila.
Si Dr. Jacquelyn.
Pero ang Dr. Jacquelyn na ito ay kakaiba. Ang kanyang balat ay sobrang puti, almost translucent. Ang mga ugat niya ay nakikita sa balat, at ang kulay ay hindi red kundi dark blue, almost black. Ang mga mata niya ay nakapikit, pero nakikita nila na may movement sa ilalim ng mga eyelids, parang may mga mata na gumagalaw sa loob.
At ang pinakanakakatakot ang kanyang bibig ay medyo nakabukas, at may lumabas na dark smoke mula sa loob.
"Dr. Jacquelyn?" tawag ni Jeffrey, pero hindi siya lumapit pa.
Ang mata ni Dr. Jacquelyn ay nagsimulang magbukas. Pero ang mga mata niya ay hindi na brown tulad ng dati. Ang mga mata niya ngayon ay completely white, walang iris, walang pupil.
At nang nagsalita siya, ang boses niya ay hindi na ang familiar na boses na kilala nila. Ang boses niya ngayon ay combination ng maraming boses, palalaki at pababae, matanda at bata, lahat nagsasalita ng sabay-sabay.
"Jeffrey... Bryan..." ang mga boses ay naging whisper, pero maririnig sa buong corridor. "You have witnessed the preparation. You have seen the gathering. You are the final witnesses to the Awakening."
"Awakening?" tanong ni Jeffrey, ang boses niya ay nangangatal na. "Dr. Jacquelyn, ano ang nangyayari sa inyo? Ano ang nangyayari sa Blackwood?"
Tumayo si Dr. Jacquelyn mula sa lotus position. Pero ang pagtayo niya ay hindi natural. Parang may invisible strings na humihila sa kanya paakyat, parang puppet na ginagalaw ng puppeteer.
"Dr. Jacquelyn is no longer here," sagot ng mga boses. "She has become the Vessel. Through her, the Ancient One will enter this realm. Through her, the boundaries between worlds will dissolve."
Ang buong building ay nagsimulang mag-vibrate. Hindi earthquake. Ang vibration ay may rhythm, parang heartbeat ng isang napakalalaking creature.
Thump-thump... thump-thump... thump-thump...
"The Ancient One has been sleeping beneath this building for decades," patuloy ng mga boses ni Dr. Jacquelyn. "The patients were never sick. They were chosen. Their minds were opened to receive the Truth. Their bodies were prepared to serve as conduits."
Sa mga patient rooms na nakaabukas, nakita nila ang mga shadows na gumagalaw sa loob. Pero ang mga shadows ay hindi mga tao. Ang mga shadows ay mas malaki, may tentacles, may multiple eyes, may mga hugis na hindi natural sa mundo.
"And now," ang mga boses ay naging mas malakas, mas authoritative, "the final phase begins. The Ancient One needs two more witnesses. Two more minds to complete the ritual. Two guards who have seen everything, who understand the magnitude of what is happening."
Ang mga mata ni Dr. Jacquelyn ay nagturn towards sa kanila. Ang white na mga mata ay parang may sariling light, naglglow sa kadiliman ng corridor.
"You will not resist," sabi ng mga boses. "Resistance is futile. The Ancient One's will is absolute."
Pero sa halip na sumunod, tumakbo si Jeffrey at Bryan patungo sa stairwell. Hindi na nila iniisip kung saan sila pupunta, ang importante ay makalayo sa entity na pumasok sa katawan ni Dr. Jacquelyn.
Tumakbo sila paakyat sa fourth floor, ang top floor ng building. Ang fourth floor ay para sa mga high-risk patients, mga taong may violent tendencies. Pero ngayon, tulad ng ibang floors, ang lahat ng patient rooms ay empty na.
Sa dulo ng fourth floor corridor may isang emergency exit na papunta sa rooftop. Ang plan ni Jeffrey ay makarating sa rooftop, maghanap ng way para makipag-communicate sa outside world, o kaya naman mag-signal for help.
Pero nang binuksan nila ang emergency exit door, nakita nila ang pinakakakaibang scene sa buong gabi.
Ang sky ay hindi na itim. Ang sky ngayon ay dark red, parang blood-colored. At sa kalangitan, may mga floating figures mga taong nakahiga sa hangin, ang mga mata ay nakapikit, ang mga kamay ay nakaflat sa gilid ng katawan.
Lahat ng missing patients.
Lahat ng missing staff.
Lahat ng mga tao na nawala sa Blackwood sa loob ng gabi.
Sila ay nakaflloat sa hangin, mga 50 feet above the building, arranged sa isang perfect circle formation. At sa gitna ng circle, may isang malaking opening sa sky isang portal na nagcoconnect sa ibang dimension.
Mula sa portal, may lumabas na tentacle. Isang napakalalaking tentacle na kumukulay dark green, may mga suckers na puno ng mga mata, at may texture na parang organic metal.
Ang tentacle ay bumaba patungo sa building, papunta sa exact location ng third floor kung saan naiwan nila si Dr. Jacquelyn.
"Tangina," bulong ni Bryan. "Jeffrey, nakikita mo ba 'yan?"
Bago pa makasagot si Jeffrey, narinig nila ang footsteps sa likod nila. Lumingon sila at nakita ang figure ni Dr. Jacquelyn na nakasakyat na sa fourth floor.
Pero ang Dr. Jacquelyn ngayon ay hindi na completely human. Ang kanyang mga braso ay naging mas mahaba, ang mga daliri ay naging mga claws, at ang kanyang buhok ay nagiging tentacles na gumagalaw mag-isa.
"The time has come," sabi ng mga boses niya. "The Ancient One is ready to enter this realm. You will be the final offering."
Ang buong building ay mas malakas nang nag-vibrate. Ang mga windows ay nagsimulang magcrack, ang mga dingding ay nagsimulang magdevelop ng mga bitak, at ang floor ay nagsimulang maging unstable.
Jeffrey at Bryan ay nakatayo sa rooftop, walang lugar na pupwedeng tumakasan. Sa harap nila ay ang transformed na si Dr. Jacquelyn. Sa itaas nila ay ang portal at ang floating bodies. Sa paligid nila ay ang crumbling building.
"Pre," sabi ni Bryan, tiningnan si Jeffrey, "ano na ang gagawin natin?"
Jeffrey ay tiningnan ang sitwasyon. May idea siya, pero sobrang dangerous. Pero wala na silang choice.
"Bryan," sabi niya, "nakita mo ba 'yung electrical panel sa may rooftop access?"
Napatingin si Bryan. May electrical panel na naka-connect sa air conditioning units ng building. Kung ma-access nila 'yun, pwede nilang i-overload ang electrical system ng building. Pwedeng makainterrupt 'yun sa ritual na nangyayari.
"Pero pre," sabi ni Bryan, "kapag ginawa natin 'yun, pwedeng sumabog ang buong building."
"At least matatapos ang ritual," sagot ni Jeffrey. "At hindi makakaenter sa mundo ang Ancient One na 'yan."
Ang Dr. Jacquelyn ay mas lalapit na sa kanila. Ang mga tentacles sa kanyang ulo ay umuusad na sa hangin, reaching out sa kanilang direction.
"You cannot stop the Awakening," sabi ng mga boses niya. "The Ancient One has been preparing for this moment for centuries. Your sacrifice will complete the transformation."
"Ngayon!" sigaw ni Jeffrey.
Tumakbo sila patungo sa electrical panel. Si Bryan ay nagbreak ng cover using sa emergency axe na nakita niya sa rooftop, habang si Jeffrey ay nagsimulang mag-cross ng mga wires para ma-overload ang system.
Pero ang Dr. Jacquelyn ay mas mabilis pa. Ang kanyang mga tentacles ay umabot sa kanila, at isa sa mga tentacles ay nakahawak sa shoulder ni Bryan.
"AHHHH!" sigaw ni Bryan nang mahawakan siya ng tentacle. Ang balat niya sa area na nahawakan ay nagsimulang magbago ng kulay, naging dark blue tulad ng mga ugat ni Dr. Jacquelyn.
"Bryan!" sigaw ni Jeffrey, pero patuloy siyang nag-work sa electrical panel.
Ang mga sparks ay nagsimulang lumabas mula sa panel. Ang electrical system ng building ay nagsimulang mag-overload.
At sa exact moment na nag-connect si Jeffrey ng last wire...
Ang lahat ay naging puti.
Ang buong building ay naging isang malaking ball of electrical energy.
Ang portal sa sky ay nagsimulang mag-close.
Ang mga floating bodies sa kalangitan ay nagsimulang magscream ng sabay-sabay - isang collective shriek na parang nag-echo sa buong Metro Manila. Ang giant tentacle na bumaba mula sa portal ay nagsimulang mag-retreat, pero hindi completely. Ang dulo ng tentacle ay nakarating pa rin sa third floor ng building.
Sa loob ng electrical explosion, nakita ni Jeffrey na si Bryan ay nahulog sa rooftop, ang kanyang katawan ay nag-convulse dahil sa combination ng electrical shock at ang transformation na nagsimula nang mangyari sa kanya dahil sa touch ng tentacle.
"BRYAN!" sigaw ni Jeffrey, pero ang ingay ng electrical discharge ay sobrang lakas na hindi niya marinig ang sariling boses.
Ang building ay nagsimulang mag-collapse. Ang mga floors ay nagsimulang magbigay, ang mga support beams ay nagsimulang matumba. Pero ang weird thing ay - ang collapse ay hindi random. May pattern, may direction. Parang ang building mismo ay nag-rereorganize ng sarili para sa isang specific purpose.
Sa gitna ng chaos, nakita ni Jeffrey na ang Dr. Jacquelyn - o ang entity na pumasok sa katawan niya - ay hindi affected ng electrical explosion. Ang kanyang transformed body ay naglglow ng dark energy, at ang mga tentacles sa kanyang ulo ay mas lumaki pa, umabot na hanggang sa ceiling ng fourth floor.
"The Awakening cannot be stopped," ang mga boses niya ay mas malakas pa sa ingay ng electrical discharge. "You have only delayed the inevitable. The Ancient One has already tasted this realm. The connection has been established."
Ang portal sa sky ay hindi completely nagsara. May maliit na opening pa rin, at mula doon, may mga smaller tentacles na patuloy na lumalabas, umabot sa iba't ibang parte ng city.
Jeffrey ay napagtanto na ang ginawa niya ay hindi nakahadlang sa ritual. Ang ginawa niya ay nagbigay lang ng mas malaking power source para sa Ancient One. Ang electrical energy ng buong building ay ginagamit ngayon ng entity para mag-stabilize ng portal.
"Shit," bulong niya sa sarili. "Hindi ko na-stop. Pinamalaki ko pa."
Ang tentacle sa third floor ay naging mas solid, mas stable. At mula doon, nagsimulang lumabas ang katawan ng Ancient One mismo.
Una, ang ulo - isang massive structure na combination ng octopus, spider, at human skull. May mga mata sa lahat ng direction, may mga bibig na puno ng mga pangil, at may mga tentacles na gumagalaw independently.
Pangalawa, ang katawan - isang writhing mass ng organic matter na parang hybrid ng iba't ibang creatures. May mga arms na may claws, may mga legs na may hooves, at may mga wings na parang may sariling consciousness.
Pangatlo, ang aura - isang dark energy na nag-emanate mula sa buong katawan ng creature, na nagcacause ng distortion sa reality mismo. Ang mga dingding ay nagiging liquid, ang hangin ay naging visible, at ang gravity ay naging unpredictable.
"The Ancient One is here," ang mga boses ni Dr. Jacquelyn ay naging whisper na, pero maririnig pa rin sa lahat ng sulok ng building. "The realm is ready for conquest."
Pero sa kabila ng lahat ng nangyayari, may nakita si Jeffrey na nagbigay sa kanya ng pag-asa.
Si Bryan ay hindi completely na-transform. Ang electrical shock ay nag-interrupt sa process. Ang parte ng kanyang katawan na nahawakan ng tentacle ay naging dark blue pa rin, pero hindi kumalat sa buong body niya. At ang mga mata niya ay conscious pa rin, hindi tulad ng ibang victims.
"Bryan," tawag ni Jeffrey, lumapit sa kaibigan. "Kaya mo pa ba?"
Tiningnan siya ni Bryan, ang mga mata niya ay puno ng sakit pero alert pa rin. "Jeffrey... may alam ako. Habang hawak ako ng tentacle, nakita ko ang memories ng Ancient One. Nakita ko kung paano siya nakapasok sa dimension natin."
"Ano? Paano?"
"Hindi siya originally mula sa dimension natin," sagot ni Bryan, ang boses niya ay mahina pero clear. "Siya ay naging trapped sa basement ng Blackwood many years ago. Ang mga founder ng hospital ay nagdala sa kanya dito para mag-experiment, pero naging too powerful siya. Kaya nila siya na-contain sa basement using... using isang specific frequency."
Napatingin si Jeffrey sa electrical panel na ginawa niya. "Frequency?"
"Ang electrical system ng building ay naka-tune sa frequency na nag-ccontain sa kanya," patuloy ni Bryan. "Pero nang i-overload mo ang system, naging imbalanced ang frequency. Kaya niya nakuha ang power para mag-open ng portal."
Ang Ancient One ay mas lumaki pa, ang katawan niya ay sumusuot na sa fourth floor. Ang mga tentacles niya ay umabot na sa labas ng building, kumakalat sa mga kalapit na structures.
"Pero may way para ma-restore ang frequency," sabi ni Bryan. "Nakita ko sa memories niya. May backup system sa basement. Manual override na pwedeng i-activate para ma-restore ang original frequency."
"Basement?" sabi ni Jeffrey. "Pero andoon ang Ancient One ngayon. Paano tayo makakapunta doon?"
Tiningnan ni Bryan ang sitwasyon. Ang building ay nag-ccollapse na, ang portal ay nag-sstabilize na, at ang Ancient One ay almost completely emerged na sa aming realm.
"May isa pang way," sabi niya. "Pero kelangan mo akong iiwan dito."
"Anong ibig mo sabihin?"
"Ang parte ng katawan ko na na-transform," tiningnan ni Bryan ang kanyang shoulder na kumukulay dark blue, "connected pa rin sa consciousness ng Ancient One. Kapag na-focus ko ang attention niya sa akin, pwede kitang ma-distract para makarating ka sa basement."
Jeffrey ay umiling. "Hindi. Hindi kita iiwan."
"Pre," sabi ni Bryan, hinawakan ang braso ni Jeffrey, "wala na tayong choice. Kapag hindi natin na-stop ang Ancient One ngayon, hindi lang ang Blackwood ang masisira. Ang buong Metro Manila, ang buong Pilipinas, ang buong mundo. Nakita ko sa memories niya. Ito ay simula lang ng kanyang conquest."
Ang Ancient One ay nagsimula nang mag-emit ng loud roar - isang tunog na nag-echo sa lahat ng dimension, na nakakaaffect sa lahat ng living beings sa radius ng ilang kilometers. Sa buong city, nagsimula nang mag-panic ang mga tao, kahit hindi nila alam kung bakit.
"Sige," sabi ni Jeffrey sa wakas. "Pero promise mo sa akin na hindi ka susuko. Kapag narestore ko ang frequency, lalaban ka pa rin."
Ngumiti si Bryan, pero ang ngiti niya ay puno ng sakit. "Promise."
Jeffrey ay tumakbo patungo sa emergency exit, papunta sa stairwell. Pero nang tingnan niya ang mga hagdan, nakita niya na ang structure ng building ay completely naging chaotic na. Ang mga floors ay naging twisted, ang mga corridors ay naging maze, at ang mga rooms ay naging distorted.
Ang reality sa loob ng Blackwood ay hindi na normal.
Pero may nakita siyang isang path - isang crack sa wall na nag-lead directly sa basement level. Ang crack ay parang naging shortcut sa normal structure ng building.
Pumasok siya sa crack, at napadpad siya sa isang underground chamber na hindi niya nakita noon. Ang chamber ay puno ng ancient symbols, carved stones, at mga machinery na parang hybrid ng modern technology at occult artifacts.
Sa gitna ng chamber, may isang console na puno ng mga switches, dials, at monitors. Ang mga monitors ay nagdidisplay ng mga wavelength patterns, frequency readings, at iba pang technical data na hindi niya completely maintindihan.
Pero nakita niya ang isang switch na naka-label ng "EMERGENCY CONTAINMENT PROTOCOL."
At sa ilalim ng switch, may nakasulat na warning: "ACTIVATION WILL REVERSE ALL DIMENSIONAL BREACHES. WARNING: PROCESS IS IRREVERSIBLE. ALL ENTITIES WITHIN CONTAINMENT ZONE WILL BE SEALED PERMANENTLY."
Napatayo si Jeffrey sa harap ng console. Naintindihan niya ang meaning ng warning. Kapag na-activate niya ang protocol, hindi lang ang Ancient One ang mase-seal. Lahat ng nasa loob ng Blackwood - including Bryan, Dr. Jacquelyn, at lahat ng staff at patients na na-transform - ay mase-seal din permanently sa dimension na ito.
Sa radio niya, na biglang nag-work ulit, narinig niya ang boses ni Bryan mula sa rooftop.
"Jeffrey... ginagawa na niya... nag-expand na ang portal... nakikita ko na ang mas malalalaking creatures sa kabilang side..."
Tiningnan ni Jeffrey ang mga monitors. Ang frequency readings ay naging mas chaotic. Ang dimensional breach ay naging mas malaki pa.
At sa isa sa mga monitors, nakita niya ang live feed mula sa rooftop. Si Bryan ay nakatayo sa harap ng Ancient One, ang kanyang transformed arm ay nag-glow ng dark energy, at ang creature ay nakatingin sa kanya with all of its multiple eyes.
Pero sa background ng feed, nakita niya ang mga mas malaking shadows na nagsisimula nang mag-emerge mula sa portal. Ang Ancient One ay hindi lang isang creature. Siya ay advance scout ng isang buong army ng interdimensional beings.
"Bryan," sabi ni Jeffrey sa radio, "I'm sorry."
"Jeffrey, ano ang..."
Pinindot ni Jeffrey ang EMERGENCY CONTAINMENT PROTOCOL.
Ang buong underground chamber ay nag-activate. Ang mga ancient symbols sa mga dingding ay nag-glow ng blue light. Ang mga machinery ay tumunog ng malakas na humming sound. At ang frequency generators ay nagsimula nang mag-emit ng isang specific wavelength na nag-ccause ng dimensional stabilization.
Sa rooftop, nakita niya sa monitor na ang portal ay nagsimulang mag-close rapidly. Ang mga floating bodies ay nahulog sa ground. Ang Ancient One ay nagsimulang mag-shrink, bumabalik sa portal.
Pero ang pinakamalungkot na nakita niya - si Bryan, kasama ang lahat ng na-transform na staff at patients, ay nagsimulang mag-dissolve din. Hindi sila namatay. Sila ay naging part ng containment field, naging permanent guardians ng sealed dimension.
Ang huling nakita niya sa monitor ay ang mukha ni Bryan na nakatingin sa camera, ngumingiti, at nag-mouth ng mga salitang: "Salamat, pre."
Tapos lahat ay naging black.
Nang magising si Jeffrey, nakita niya ang sarili niya sa labas ng Blackwood building. Ang araw ay sumusukat na. Ang building ay nag-collapse completely, pero hindi dahil sa explosion. Ang collapse ay naging isang perfect implosion, parang ang building ay naging compressed sa isang single point.
Sa lugar kung saan ang Blackwood ay dating nakatayo, may naiwan lang na isang malaking crater. At sa gitna ng crater, may isang small monument na may nakasulat:
"IN MEMORY OF THOSE WHO SACRIFICED THEMSELVES TO MAINTAIN THE BALANCE BETWEEN WORLDS."
At sa ilalim ng main inscription, may mga pangalan:
"BRYAN MARTINEZ - SECURITY GUARD DR. JACQUELYN SANTOS - PSYCHIATRIST MARGARET TORRES - RECEPTIONIST CATHERINE REYES - NURSE (AND 47 OTHER SOULS WHO CHOSE DUTY OVER SURVIVAL)"
Jeffrey ay nakatayo sa gilid ng crater, nakatingin sa monument. Sa kanyang bulsa, may nakita siyang isang folder na hindi niya naalala na dinala. Binuksan niya ang folder, at nakita niya ang mga document na nag-eexplain ng real history ng Blackwood.
Ayon sa mga document, ang Blackwood Psychiatric Institution ay hindi originally hospital. Ito ay isang containment facility na ginawa ng isang secret organization para sa mga interdimensional threats. Ang mga "patients" ay hindi talaga may mental illness. Sila ay mga psychic individuals na na-recruit para maging guardians ng facility.
At ang mga "night shift guards" tulad niya at ni Bryan ay hindi random na na-hire. Sila ay na-select dahil sa kanilang psychological profile, dahil sa kanilang ability to handle extreme stress at makagawa ng difficult decisions.
Ang quiet night na nangyari ay hindi isang isolated incident. Ito ay isang regular na test ng containment system. At ang mga taong namatay ay hindi talaga namatay. Sila ay naging part ng eternal guard duty, mga sentinel na magbabantay sa sealed dimension para hindi na ulit mag-escape ang Ancient One.
Sa last page ng folder, may nakasulat na message:
"JEFFREY MARTINEZ - YOUR SERVICE IS COMMENDED. REPORT TO THE NEW FACILITY LOCATION FOR REASSIGNMENT. THE WORK CONTINUES."
At sa ilalim ng message, may address ng isang building sa Makati.
Tiningnan ni Jeffrey ang monument sa huli bago siya umalis. Nakita niya na ang mga pangalan sa monument ay nag-glow ng maliit na light tuwing sunset at sunrise, parang reminder na ang mga taong namatay ay still active sa kanilang duty.
"Salamat din, Bryan," bulong niya. "Salamat sa lahat."
Naglakad si Jeffrey palayo sa crater, patungo sa kanyang next assignment. Dahil alam niya na ang trabaho niya ay hindi pa tapos. May mga iba pang facilities, may mga iba pang Ancient Ones, at may mga iba pang quiet nights na naghihintay.
Pero habang naglalakad siya, may narinig siyang isang maliliit na whisper sa hangin. Ang boses ni Bryan, nanggagaling sa dimension na na-seal.
"Pre... hindi pa tapos ang laban... may iba pa..."
At sa kadiliman ng umaga, bago sumikat ang araw, nakita ni Jeffrey ang mga shadow figures sa mga sulok ng mga building sa paligid. Mga shadow figures na nakatingin sa kanya, naghihintay ng tamang oras para sa susunod na quiet night.
Ang cycle ay magpapatuloy.
Ang bantay ay magpapatuloy.
At ang Jeffrey Martinez ay magpapatuloy sa kanyang trabaho bilang guardian ng mga bagay na hindi dapat makita ng ordinary na mga tao.
Pero sa ngayon, kailangan niya munang mag-report sa bagong facility.
Kailangan niya munang malaman kung sino ang magiging kasama niya sa susunod na night shift.
Kailangan niya munang maging handa para sa susunod na quiet night na mas delikado pa sa naranasan niya.

The air was quiet, but her mind was not.
Hazel sat motionless on the edge of her twin-sized bed, fingers clenched around the fabric of her sheets like they might anchor her to reality. Outside her apartment window, the streetlight flickered weakly, casting long, jittering shadows across her wall. It reminded her of candlelight. Of rituals. Of secrets whispered in the dark.
And then, Carl.
Always, Carl.
He had smiled at her today. Just a small one. Just enough. Just enough to live on. It was the kind of smile that didn't belong in a classroom, so casual yet intimate, like he knew something about her that no one else did. Like he saw her. Like she mattered.

It was Nova.
Calm. Cold.
“Don’t,” she said.

His stomach dropped. “What?”
“I’m not Ghost Grid,” she said. “Not anymore.”

She nodded. “That was your first mistake.”
From the shadows, Director Ardyn stepped in.
Flanked by two AI constructs tall, armored, faceless.
“Prince Elardo,” she said, like greeting an old friend. “Welcome to Sector 77.”
Prince aimed at her.
“Try me,” he said.
She smiled.
“You’re holding the last pure version of the kill-switch. You’re valuable. But not irreplaceable.”
She looked at Jeffrey.
“He was always the easier target.”
Prince’s voice cracked. “What did you do to him?”
“He opened the file. Let it inside. The code rewrote part of him. He’s not just a carrier now. He is the kill-switch.”

“You still with me?”

“For now.”

The room went dark.
Smoke hissed from the vents.

Prince grabbed Jeffrey’s restraints. “You still in there?”
Jeffrey nodded. “Barely.”
Ardyn shouted. “Contain them!”
But it was too late.
The chip glowed in Prince’s hand.
Jeffrey reached out.
Touched it.
And the whole building shook.

Zentech’s logo glitched.
Sirens died.

Something was coming.
A shutdown. A reset.
A war.

He didn’t care anymore.

People stopped and stared.
Sky-billboards stuttered.

Prince looked down at Jeffrey.
Still breathing.
But for how long?
He held the last fragment of the kill-switch in his bloodied hand.
And looked up at the digital city.
“You wanted a fight,” he whispered.
 “You’ve got one now.”

Downtown at 2:03 a.m. felt like the world had stopped breathing.
The streets were empty, neon signs flickering against puddles from a storm already forgotten. In the shadow of an old finance tower, a black delivery van rolled to a stop near a service entrance. It idled for exactly nine seconds.
Then the rear doors opened.
Four figures stepped out. All black. Gloved. Masked. No faces, no voices.
No names.
Only codenames.
Ghost was first.
Lean. Fast. He moved with a sharpness that didn’t belong on these streets. A wirecutter in one hand, tablet in the other. Already disabling the building’s sensor grid before the second figure even hit the ground.
Rogue was second.
Taller. Heavyset. Carried a black duffel with equipment no one should own modified lockpicks, smoke canisters, even a hand-built jammer. If Ghost was the key, Rogue was the door.
Slick came third.
Slick was all fluid movement and no wasted breath. A former wheelman, maybe. Definitely ex-military. Always scanning, always quiet. Carried nothing but a pistol, two knives, and a look that said get in and get out, or die trying.
And the last?
Ace.
The leader.
Ace didn’t bark orders. Just moved like they’d done this a hundred times. The kind of presence that told the others when to breathe.
They approached the service entrance.
Ghost tapped the panel.
“Three wires, split feed. I can kill it for sixty seconds. After that, building systems reboot.”
Ace nodded. “That’s enough.”
Ghost clipped the wires.
“Timer starts now.”
Rogue picked the lock in under four seconds. Slick stepped in first, pistol drawn, already sweeping the hallway. Ghost was next, plugging a repeater into the camera system. They weren’t just invisible they were ghosts on the wire.
Ace followed last.
No one said a word.
The plan was simple: in and out in under seven minutes.
Target: floor 9. A private vault inside the penthouse office of a known narcotics financier. Inside: cash, data drives, and rumor said a prototype narcotic not yet released to market.
Street value? Seven figures.
Risk? Doesn’t matter when no one knows who you are.
The elevator was disabled, so they moved fast up the stairs, boots silent against metal. Ghost reached the security hub first, slicing into the wall and feeding a live loop of hallway footage back into the system.
Rogue laid a charge on the penthouse door not enough to draw attention, just enough to pop it quietly.
Ace signaled.
Three fingers.
Two.
One.
Boom  click.
The door opened.
Inside: dark wood, crystal walls, gold trim. Corporate elegance, untouched by the filth outside.
Slick cleared left. Ghost right.
Rogue locked the hallway door behind them.
Ace walked straight to the safe embedded in the far wall.
“Time?” Ace asked.
“Three minutes left,” Ghost whispered.
Rogue unpacked the thermal drill.
Slick stood by the windows.
Something was off.
He stared at the building across the street. A single light. One window. A shadow.
“Movement,” he said softly.
Ace walked over.
The window across the way was dark now.
Ghost looked up from the loop. “I didn’t pick up a signal from that building.”
Ace stared a second longer, then turned.
“Focus. In and out.”
The safe opened.
Inside: cash. Drives. And a silver briefcase with a bio-lock.
Rogue whistled. “Found the good stuff.”
Ace grabbed the briefcase, tossed the drives to Ghost, and signaled to move.
“Two minutes.”
They turned and froze.
The hallway door was open.
Unjammed.
No sound.
Slick raised his gun.
“Someone’s here.”
Then the lights went red.
Not an alarm just red.
The emergency system had been triggered.
“Not me,” Ghost said instantly.
“Wasn’t me,” Rogue added.
Ace looked to Slick.
Slick didn’t answer.
He was already moving toward the stairs.
They hit the landing fast, guns out now. Ghost had disabled the grid, but this wasn’t tech-triggered. Someone was inside.
And watching.
As they reached the third floor, a shadow crossed their path.
A man in a mask.
Not one of theirs.
Not security either.
He had a pistol in one hand and a badge on his hip.
But no name.
No shout.
Just a grin.
“I’ve been waiting for you.”
Gunfire.
Slick dropped him with a single shot.
But they all heard it.
Police wouldn’t work without backup.
“Move,” Ace said.
They hit the street fast. Ghost wiped the van’s plates as they jumped in. Rogue threw a flash out the back as lights flashed down the block.
Cops. Or worse.
Sirens behind them now.
Slick drove.
He didn’t speak.
He just moved.
Ten blocks. Eleven. Then down a tunnel near the river.
They changed vans. Burned the gear.
By 3:05 a.m., they were ghosts again.
Back at the safehouse, they sat in silence.
No names. No questions.
The briefcase was on the table.
Ace opened it.
Inside: clear vials. Blue liquid. Glowing faintly.
Ghost leaned in. “Is that what I think it is?”
“No idea,” Rogue said. “But someone wanted it watched.”
Slick finally spoke. “That wasn’t a beat cop. That was an asset. Undercover.”
Ace nodded.
“They knew we’d come.”
Ghost glanced around the room.
“So who talked?”
No one answered.
Ace’s eyes met Slick’s.
Still nothing.
Then Ace spoke, calm but sharp.
“We lay low. One week. No contact. And if one of you’s dirty...”
The silence finished the sentence.
Outside the safehouse, in an unmarked car, a figure watched through binoculars.
He spoke into a mic.
“They’ve got it. The vials.”
A voice responded.
“Good. We’ll let them run... then we bleed them.”

Chapter One: After the Smoke
Three hours after the job, the crew scattered like ashes in the wind.
That was the rule: never go home. Never check in. Never stick together too long.
Slick vanished into the rail district, disappearing between moving trains. Rogue took the gear and stashed it in a dead drop under a bridge only he knew. Ghost went underground literally hacking into a burned-out comms tower to scrub digital signatures and reroute the van’s stolen tags.
Ace stayed last.
Ace always stayed last.
Cleaning the footprint. Watching the watchers.
And wondering which of them if any was cracking.
Ghost’s hideout was six floors beneath an abandoned radio station.
He worked fast. Re-routed traffic logs, looped security cams, and wiped every drone feed within a mile of the job site.
But something pulled at him.
He replayed the elevator footage something had glitched when they reached floor 9.
Not the building systems.
Not his fault.
Just… something odd.
A second reflection in the elevator glass. Too fast. Too vague.
Not one of them.
Not visible in the hallway.
A fifth person in the building?
Ghost paused the feed and leaned in.
“You’re not supposed to be there.”
Rogue’s apartment looked like a mechanic's garage exploded inside a chemistry lab.
He’d broken down one of the vials already. The blue liquid shimmered strangely under low light, almost like it was alive.
He didn’t like that.
He tested it with a spectrometer.
Results: unknown composition. Non-organic. Mutagenic markers present.
Whatever it was, it wasn’t street dope.
It was new.
He rubbed the back of his neck and stared at the glowing vial.
Then he opened a drawer.
Inside: dozens of burned SIMs. One for each job.
He pulled a fresh one out, loaded it into a burner phone.
Typed one word to a private number.
“You never said it was biotech.”
Slick sat in a one-room crash pad above a junkyard.
The lights were off.
The silence was heavy.
He stared at the ceiling, unmoving, a pistol resting on his chest.
Across from him, a cheap TV played a news report volume low.
“Last night’s explosion in the finance district appears to be related to gang activity”
Lies. Always lies.
Slick reached under the bed and pulled out a metal box.
Inside: cash, IDs, passports.
And a letter.
Unopened.
He stared at it.
Then burned it without reading it.
Ace watched the sunrise from the roof of a parking tower.
The briefcase sat beside them, untouched.
Seven figures of raw potential and zero answers.
Ace didn’t trust silence.
Didn’t trust how fast the cops had arrived.
Didn’t trust the way that masked man had smiled before Slick pulled the trigger.
And most of all?
Ace didn’t trust the team anymore.
Not after last night.
At 10:46 a.m., each crew member received a signal.
Not from Ace.
Not from Ghost.
Not from anyone they knew.
Just a ping on a burner, a message that appeared briefly before erasing itself.
Each message was slightly different.
But each included one thing:
A real name.
Ghost’s phone lit up:
“You’re not just a hacker, are you, Jordan?”
He froze.
No one knew that name.
Not even the crew.
He crushed the phone instantly.
But his hands trembled.
Rogue’s screen flashed:
“Next time, wear gloves, Matias. Prints are messy.”
He dropped the burner into acid without a second thought.
But he didn’t stop shaking until the fumes burned his nose.
Slick stared at his phone.
His message was shorter.
“Hello again, Nathan.”
He didn’t move.
Didn’t breathe.
He just stared.
Then reached for the gun.
And checked the magazine.
Ace got no message.
But at 10:47 a.m., a red flare went off on top of a building four blocks away.
A signal.
A threat.
Or an invitation.
Ace grabbed the briefcase.
And vanished into the alleys.
The next night, the crew met again.
Old warehouse. Usual code.
They didn’t speak at first.
Just looked at each other.
Then Ghost stepped forward.
“Someone’s hunting us.”
“No,” Rogue said. “Someone’s playing us.”
“I got a message,” Ghost said. “Used my name.”
Rogue nodded. “Me too.”
Slick said nothing.
Ace just watched them.
“Then it’s official,” Ace said. “This job was bait.”
“For what?” Ghost asked.
Ace opened the briefcase.
“This.”
They all stared.
Then Slick finally spoke.
“That's not drugs.”
“What is it?” Ghost asked.
Rogue cleared his throat. “It’s experimental. Not for use. Maybe not even for sale.”
Ghost looked at him. “How do you know?”
Rogue didn’t answer.
Ace stepped forward.
“There’s a leak in the crew.”
No one moved.
Ace pointed at the briefcase.
“This was tagged. Light trace. Almost invisible. But someone knew we’d take it. Knew where we’d go. Knew who we are.”
They all looked at each other.
The silence felt like glass.
Ace broke it.
“One of you isn’t who you say you are.”
Slick slowly stood up.
Pulled out his pistol.
And laid it on the table.
“I’m not the rat,” he said.
“But I think I know who is.”

Chapter Two: No One Leaves Clean
Slick’s pistol lay on the table, but his eyes were on Rogue.
“You’re the only one who knew what the vials were,” he said flatly.
Rogue raised both hands. “I tested it after the job. That doesn’t make me the leak.”
“It makes you the only one who wasn’t surprised,” Slick replied.
Ghost crossed his arms. “We all got the messages. Real names. Whoever’s playing us had access to personal records. That’s deep. Not some street snitch level.”
Ace watched them, silent.
Let the crew tear at itself before stepping in.
Standard tactic.
But this time, it was slipping faster than usual.
Rogue stepped forward. “Let’s say it was me. Why would I stay? Why keep running with a crew I just sold out?”
“Cover,” Slick said. “Or maybe you didn’t think it’d go sideways so fast.”
“Or maybe you’re deflecting,” Rogue shot back. “I saw how you froze up after the heist. You burned a letter. You’ve got something you’re hiding.”
Ghost stepped between them.
“Enough.”
He looked to Ace. “Say something.”
Ace didn’t blink. “The data trace on the case. It wasn’t a tracker. It was biometric. Latched on to whoever opened it.”
Ghost frowned. “So?”
Ace turned to the group.
“One of us got tagged. One of us brought the message down on all of us.”
A silence fell.
Then Ghost’s voice, quieter. “We all touched it.”
“No,” Ace said. “Only I opened it. The print signature should’ve locked to me. But the trace didn’t match my pattern.”
“So whose was it?” Rogue asked.
Ace looked at each of them.
Then stopped.
“Slick.”
Slick’s jaw tightened.
“I never touched the case.”
“You stood over my shoulder,” Ace said. “I saw your glove come off.”
Slick looked at the table.
The pistol still sat between them.
He didn’t reach for it.
But he didn’t deny it either.
Ghost broke the tension. “Hold on. What if… what if this isn’t about betrayal? What if it’s bigger?”
They looked at him.
He tapped the hard drive he’d decrypted that morning.
“The vials? They aren’t drugs. Not really. They’re programmable. Synthetic neuro-path agents. You don’t get high on this stuff.”
Rogue’s eyes widened. “Then what the hell does it do?”
“It lets someone control you.”
Everyone went still.
Ghost continued. “You inject this, you become a networked device. Your thoughts? Trackable. Your body? Hackable. Zentech tech. Prototype stuff.”
Slick cursed. “Then whoever uses it…”

“So this wasn’t a robbery.”
“No,” Ghost said. “It was a delivery. We picked up someone’s product drop. And now they want it back clean, quiet.”

He was cracked.
Ghost stepped forward.
“Put it down.”
Slick shook his head.
“I have a sister. She’s sick. Zentech said one job. Just one. They knew we’d take the vials. They said if I helped, they’d pay off her treatment.”

And ran.

“Too late.”
From the alley outside, a sound.
Gunfire.
One shot.
Then silence.
Ghost moved to the window.
He looked down.
The body was gone.
But the blood?
Still fresh.

Fewer now.
The briefcase on the table between them again.
Unopened vials.
Ghost pulled out a burner phone.
One last tool.
He dialed a number that no one else knew.
It rang twice.
A voice answered.
“Didn’t think I’d hear from you again.”
Ghost kept his voice even. “They found us. You were right.”
“Of course I was,” the voice said. “You ready to trade?”
Ghost looked at the others.
Then back at the phone.
“Not yet.”
The voice chuckled. “Then you better move fast. Zentech doesn’t wait.”
Ghost hung up.
Ace stood.
“This changes the rules.”
Rogue nodded. “And the crew.”
Ghost’s voice was low.
“We started nameless to protect ourselves.”
Ace finished the thought:
“Now we stay nameless to survive.”
From a skyscraper window across the city, a figure in a suit watched the warehouse through a drone’s eyes.
She sipped coffee.
Smiled.
And whispered:
“Next move is theirs. Let’s see who breaks first.”

Chapter Three: The Price of the Unseen
By the next night, Slick’s name wasn’t spoken again.
Not because he didn’t matter.
But because saying names was a luxury they couldn’t afford anymore.
They didn’t even know each other’s real names.
But now someone else did.
Someone was peeling away the mask, layer by layer.
And time was running out.
The three remaining thieves Ace, Ghost, and Rogue gathered at an abandoned train depot deep beneath the city. Dust settled in shafts of moonlight. The sound of silence scraped like nails.
The briefcase sat on a crate between them.
Ghost stared at it like it might explode.
“We should burn it,” he said for the third time.
Rogue disagreed. “Burning it makes it worthless. Selling it makes us powerful.”
Ace stood apart, watching both of them.
Said nothing.

Ghost raised a brow. “You want to use it?”
Ace nodded. “Not on us. On them.”
“Inject a corp exec?” Rogue scoffed. “That’s suicide.”

“You’re still alive,” she said.

Call ended.

“She wants to meet. Same voice.”
Ace nodded. “Then we let her think you’re alone.”
Rogue smirked. “Tactical tail?”
Ace looked at him.
“Insurance.”

She sat in a metal chair, back to the wall. Black boots. Tactical coat. A tablet in one hand, a pistol in the other.
Eyes cold.
Voice precise.
“Ghost,” she said.
“Not my name,” he replied.
“I know,” she said.
“But you’re not really a ghost, are you, Jordan?”
He froze.
Her smile barely moved.
“I work for no one,” she said. “Not Zentech. Not the cartel. I collect risk. Turn it into power.”
Ghost didn’t move.
“You stole a product that can change everything. And they’re scared. Not because you have it” she leaned forward “ but because you don’t understand it yet.”
“What does it do?”
She tapped the tablet.
A hologram blinked to life a map of the city, with nodes of light across every sector.
“Everyone injected becomes a signal. Trackable. Manipulatable. Activatable.”
“They’re building a city of puppets.”
Ghost’s voice was tight.
“And you want us to do what with it?”
She smirked.
“I want you to sell it. To me.”
Ghost blinked. “You want to control it?”
“I want to decide who doesn’t get it.”
A beat.
“Better the devil with a sense of morality... than the devil with a budget.”
He stared at her.
“You want to be the new Zentech.”
“No,” she said.
“I want to make sure no one ever is again.”
Ace and Rogue listened from a rooftop across the street.
Ghost had a hidden mic.
They heard every word.
Ace muttered, “She’s not wrong.”
Rogue frowned. “She’s not clean either.”
Ghost’s voice came through the comm: “What do I get?”
She responded, calm: “Freedom. Immunity. New names.”
Rogue whispered, “Sounds like a trap.”
Ace nodded. “It is.”
Suddenly, the line cut.
Ghost’s audio died.
Rogue stood. “We go now.”

On the feed, Ghost looked around. “Where’s the rest of your crew?”

“Gone.”
And then the windows exploded.

Another figure in black.
Same height as Ghost.
Moving like him.
But not him.
He walked to the briefcase.
Opened it.
And left with it.
The others didn’t see him come.
Didn’t see him go.
Just the silence.
And the empty crate.
Back at the ambush, Ghost crawled from rubble, coughing, bleeding.
The woman was gone.
The room scorched.
Ace and Rogue reached him seconds later.
“Are you hit?” Ace asked.
“Just bruised,” Ghost coughed.
Rogue looked around.
“She torched the place.”
“No,” Ghost said, eyes wide. “She covered her exit.”
Ace’s eyes narrowed.
“Where’s the briefcase?”
They looked at each other.
And ran.
But they were too late.
A live feed appeared across the city.
From a secure terminal in a moving car.
The briefcase in frame.
And a voice:
“Your secrets were never safe. You weren’t the only thieves in this game.”
The video glitched.
Paused.
And on screen four still images.
Ghost.
Rogue.
Ace.
And someone else.
Slick. Alive.
Smiling.
To be continued...

Joseph woke up handcuffed to a hotel minibar.
He wasn’t in his room. He wasn’t even in a room he was halfway inside a closet, one foot tangled in a feather boa, the other resting in a punch bowl filled with Doritos and what smelled like tequila.
His first words?
“...Did we win?”
Silence.
He groaned, rubbed his eyes, and blinked.
The chandelier above him was swinging gently.
There were flamingos drawn on the walls in permanent marker.
And someone somewhere was still snoring through a megaphone.
Joseph squinted toward the bed.
No John-john.
Not good.
“John-john?” he called, struggling against the handcuffs. “Bro? Did you did you really tattoo your name on a goat last night or was that...?”
He stopped.
There was a goat.
It stared at him.
Wearing sunglasses.
Joseph screamed.
The goat screamed back.
Twelve Hours Earlier...
It all started at Bar Soñando a neon-drenched disaster of a place downtown, where drinks were cheap, music was louder than judgment, and the bouncer was legally blind in one eye.
Joseph and John-john sat at the bar, sipping mango slushies spiked with whatever was on sale, and planning exactly nothing useful with their Friday night.
“You ever think,” Joseph said, swirling his straw, “that we’re, like, underachieving legends?”
John-john blinked. “Define... achieving.”
“Like, people talk about us. But not, like... fear us.”
John-john leaned back. “What if we fixed that?”
Joseph perked up. “Go on.”
Across the bar, a man in a white blazer was handing out fancy envelopes to the hottest people in the room.
Joseph and John-john were definitely not on that list.
Which is exactly why they got up.
“Gentlemen,” the man said, clearly judging their scuffed sneakers and mismatched socks, “this is an invite-only affair.”
“Exactly,” Joseph grinned. “And we were only waiting to be invited now.”
John-john nodded solemnly. “VIP stands for Very... Important... Partygoers.”
The man blinked. “That’s not what never mind.”
He handed them the last two envelopes. “Do not embarrass me.”
Joseph saluted with his straw. “Sir, embarrassment is our brand.”
The address led to Hotel Dalisay, a place with gold elevators, champagne fountains, and people who used the word “network” as a verb.
Joseph and John-john stepped in like they owned the place Joseph in a hoodie that said “I’m With Dumb”, and John-john in cargo shorts he called “tactical luxury.”
Inside?
Carnage disguised as class.
There were models dancing in bathtubs.
A mariachi band battling a DJ in a sound war.
And a guy in the corner calmly shaving an alpaca.
John-john nudged Joseph. “Is this heaven?”
Joseph looked around.
“No, bro. This is war.”
They split up.
Joseph ended up doing karaoke with a woman who claimed she invented bubble tea. John-john challenged three rich dudes to a chug-off using flaming shots and a watermelon.
They won. Probably.
Then things got blurry.
Someone shouted, “WHO BROUGHT THE FIREWORKS?!”
A blender exploded.
A penguin in a vest ran across the lobby.
Joseph vaguely remembered trying to breakdance on the elevator ceiling.
He high-fived a guy in a spacesuit.
Someone handed him a baby.
He lost the baby.
Then someone said, “Let’s hit the private floor.”
And everything went sideways.
Now back in the present, Joseph yanked on the handcuffs until they snapped off the minibar handle with a crack!
He stumbled to his feet.
His hoodie was covered in glitter.
One eyebrow was missing.
And taped to his chest was a sticky note:
“Room 704. Don’t forget the duck.”
He looked around.
The goat was gone.
But there was now a duck sitting in the bathtub.
“Of course,” Joseph muttered. “Of course there’s a duck.”
He limped out into the hallway.
Room 704 was down the corridor past the guy asleep inside a vending machine and a trail of cocktail shrimp leading to a potted plant on fire.
He knocked.
No answer.
He knocked again. “John-john? If you’re in there and you’ve started a cult, just blink twice.”
The door opened.

“You don’t do this often, do you?” he asked as they sipped coffee by a window.

“Act like a normal person. Relax. Socialize. Sit beside people without stabbing them with a pen.”

Then she looked at him and for the first time, Carl saw it.
Not fear. Not anger. But loneliness.
And suddenly, this didn’t feel like a boss and employee talking anymore.
It felt like something was beginning.
Something electric.
Something dangerous.
Something real.

Chapter 3 – Things You Shouldn’t Know
There were a million ways Carl had imagined sitting beside Hazel Morales.
In most of them, he was either getting fired or fantasizing while daydreaming through a meeting.

Carl’s stomach dropped at her use of the past tense.
“Was?”
Hazel nodded. “He was... someone I trusted. Someone I” She stopped. Breathed in. “He used to work with me. At Silver Edge.”
Carl frowned. “I’ve never heard of him.”
“You wouldn’t have. He... disappeared. A year ago.”
Silence stretched between them.
“Disappeared?” Carl asked, voice low.
“They said he went off the grid. Resigned. That’s what the company told everyone.” She paused. “But I know he didn’t leave voluntarily.”
Carl leaned closer. “Hazel, are you saying someone made him disappear?”
Hazel’s eyes flicked up to meet his. And for the first time, she looked utterly, undeniably unsure. Like the fortress she had built around herself had started to crumble.
“I think so,” she whispered.
Carl didn’t know what to say. So he reached across the table and placed his hand on hers. Slowly. Tentatively.

One message.
Unknown Number: “You’re talking too much, Hazel.”

He would find out the truth.
He didn’t go home.

He spun around.
Hazel stood there.
In the dark.

A beat.

Carl nodded. “I just want to understand. If something’s happening if someone’s threatening you I can’t just pretend it’s none of my business.”
Hazel stepped inside. Closed the door.
Then, to Carl’s absolute shock, she walked over to her desk, reached under it, and pulled out a locked metal case.
She set it down in front of him.
And unlocked it.
Inside were files. Dozens of them. Photos. Notes. Surveillance images. Even screenshots from the same CCTV system at Parkridge.
Carl leaned in, stunned. “You’ve been investigating this.”

In the café.

No signal.

A new message popped up.
From an unknown account.
“You’ve seen too much.”
Then another.
“Now it’s your turn to disappear.”
Hazel looked up at him.
Carl’s heart thudded.
Footsteps echoed from the hallway.
They weren’t alone.

                title: "Prologue 12: The Independent Woman",
                content: `"The Independent Woman"
The first thing you notice about Mae Vivar isn’t her beauty, though she has that in abundance.
It’s her presence.
She walks into a room like she’s already paid for it in full elegant, poised, and completely untouchable. The kind of woman who doesn’t wait to be invited to the table because she owns the table, redesigned it, and already made five deals while sitting at it.
At thirty-two, Mae Vivar had what most women only dreamed of: her own real estate firm, a sleek penthouse in BGC, a six-figure monthly income, and freedom.
Freedom was her favorite possession. It was the one thing she refused to let anyone take from her.
Not her ex-boyfriend who wanted her to slow down and “make time for the relationship.”
 Not the society that called her “too ambitious,” “too intimidating,” “too much.”
And definitely not her parents, who once told her, “No man will want a woman who doesn't need him.”
She needed no one.
But she wanted someone.
And that was where the trouble began.
It was raining the first time she saw him again.
Charles.
She had just finished a long client dinner and was walking back to her car, heels tapping against the wet sidewalk like a metronome keeping time with her thoughts.
He was leaning against a parked tricycle, half-soaked, with a cigarette in one hand and a worn-out guitar case in the other.
"Mae?"
She turned, and the years collapsed between them like paper.
She hadn’t seen him in five years.
"Charles?" she asked, eyebrows arching. “Still alive, I see.”
He laughed, that deep, low sound that always used to make her feel like everything would be fine, even when it wasn’t.
"Still surviving,” he said. “You?”
"Thriving."
"Of course you are."
She didn’t ask how he’d been. Didn’t need to. It was in the lines on his face, in the way he carried himself. He looked older. Wiser. Tired, but peaceful.
Unlike her.
She always looked perfect.
Felt anything but.
Two days later, they had coffee.
Not in a fancy rooftop bar. Not in a candlelit resto with jazz music in the background.
At a roadside café. One table. Two chairs. No aircon.
“Still allergic to small talk?” Charles asked, stirring his coffee.
“Still in love with deep conversations and unnecessary eye contact?” she shot back.
They smiled.
It was awkward at first, like trying on a jacket you hadn’t worn in years. But slowly, carefully, the conversation softened.
He talked about his music, the gigs that didn’t pay much but gave him life.
She talked about her business, her board meetings, the silence of a penthouse too expensive to feel like home.
“You built an empire,” he said, not with awe, but with quiet respect.
“And you disappeared,” she replied, not with bitterness, but truth.
“I didn’t know how to stay,” he admitted.
“I didn’t know how to wait,” she whispered.
And that’s how it started again.
Not with sparks.
But with honesty.
Over the next few weeks, Charles returned to her life like a melody she’d forgotten how to hum.
They weren’t together. Not yet. Maybe not ever.
But Mae began to feel something unfamiliar: softness.
He didn’t try to change her. Didn’t tell her to “take it easy” or “act more feminine.” He didn’t flinch when she talked numbers, strategies, or power plays.
He just listened.
Sometimes, that’s all it takes.
But for someone like Mae, love isn’t simple. It never was.
Because freedom was her religion.
And Charles?
 He was a man who believed love wasn’t a cage, it was a mirror.
And Mae... she wasn’t sure what she’d see when she finally looked into it.

Chapter 1 – Power Has a Price
Mae Vivar’s mornings began like clockwork.
4:45 AM  wake up
 5:00 AM  Pilates and lemon water
 6:00 AM  cold shower, skincare, green smoothie
 7:00 AM  review reports while watching the sunrise over the city skyline
While the rest of the world dragged itself out of bed, Mae was already two hours ahead — perfectly polished, effortlessly in control.
She lived by one unspoken rule: if you want to stay on top, don’t stop moving.
Her phone buzzed.
Bea – Assistant
“Your 9AM board meeting just got moved to 8:30. Heavy traffic is reported in the Makati area.”
Mae didn’t curse. She never cursed, not out loud. Instead, she took a deep breath, changed her route mentally, and signaled her driver.
Control. Always maintain control.
By 8:28 AM, she was seated at the head of a long, glass conference table at Vivar Realty’s corporate office, a minimalist space with bold architecture, clean lines, and an atmosphere sharp enough to cut tension with.
"Let’s begin," she said.
Two hours, five presentations, and one executive who almost cried later, the meeting was done.
Mae stood, back straight, heels silent against the floor as she exited the room. Her team trailed behind her like shadows, efficient, loyal, and slightly terrified of disappointing her.
She made her way to her private office. Floor-to-ceiling windows. A sleek desk. A quiet kind of luxury that spoke in fluent power.
She poured herself black coffee, no sugar, no cream.
And then, for one brief moment, she sat back.
Alone.
Not lonely or so she told herself.
Until a message popped up on her personal phone.
Charles: “Are you still allergic to chaos? Or would you like some for lunch?”
She stared at the screen, lips twitching.
Of course he would text that.
They hadn’t seen each other since the coffee at the roadside café. That had been... what, ten days ago?
Ten days since she’d felt something not related to closing a deal or crushing a quarterly target.
She started to type: “I’m busy.”
Deleted it.
Typed again: “What did you have in mind?”
Sent.
Five seconds later:

Charles: “I’ll pick you up. 12:30. Don’t wear heels.”
She stared.
What kind of man tells Mae Vivar not to wear heels?
She shook her head, set the phone down, and laughed.
Only Charles.
At 12:30, he was waiting downstairs on a motorcycle.
Of course.
Wearing a black jacket, jeans, and that same calm expression that made him look like he had nowhere to be, yet understood everything happening around him.
“I should’ve ignored your text,” Mae said flatly as she stepped toward him.
“But you didn’t,” he smiled.
She looked at the helmet he held out.
“You realize I haven’t ridden on one of these since college?”
“I do. That’s exactly why we’re doing it.”
For a moment, she hesitated.
This wasn’t her world. This wasn’t part of the plan.
But then again, the plan was starting to feel... suffocating.
So she took the helmet. “If I die, I’ll sue you.”
“If you die, I’ll die with you. Romantic, right?”
“Reckless,” she muttered but she was already climbing on behind him.
They rode out of the city. No destination. No emails. Just wind, motion, and the uncomfortable sensation of not being in control.
For the first twenty minutes, Mae was stiff holding on only when absolutely necessary.
By the forty-minute mark, she’d loosened.
By the hour, she was laughing.
They stopped at a roadside diner somewhere on the outskirts of Laguna. It was old, quiet, and charming in a way she never would’ve chosen but she liked it.
Charles ordered grilled liempo and iced tea.
Mae ordered the same.
“See?” he said, smiling as they sat down. “You don’t always have to wear heels to feel tall.”
“Deep,” she replied. “You plan that line while driving?”
“Ten minutes into EDSA traffic.”
She chuckled.
Then silence.
But not an awkward one just… stillness.
He looked at her, serious now.
“You don’t let many people in, do you?”
Mae tensed slightly. “I let people in. Just… not too far.”
“Why not?”
“Because they either want to own you, fix you, or compete with you.”
“And I?”
She met his eyes. “I haven’t decided yet.”
Charles leaned back. “I’m not here to do any of those. I just like watching you be you.”
Mae’s jaw clenched not because she was angry, but because that felt too close. Too sincere.
She’d spent years building armor.
But now, there was a man who saw right through it and still wanted her.

Chapter 2 – The Woman She Had to Be
Mae didn’t cry.
Not in public. Not in private. Not even when the people she thought would stay had left.
She didn’t cry when her first investor pulled out the night before her launch.
She didn’t cry when her ex-fiancé told her he loved her, but not her ambition.
She didn’t cry when she watched her mother lower herself, again and again, for a man who never deserved her.
Instead, she built. She worked. She rose.
And somewhere along the way, she forgot what softness felt like.
Until now.
Until Charles.
She hadn’t planned to see him again that week.
Work was brutal: two site inspections, a lawsuit she had to smother before it reached the press, and a feature interview with a lifestyle magazine that wanted her to talk about her “personal balance.”
Balance?
Her assistant Bea had suggested she include a “boyfriend” in the narrative. Just for the brand. Something relatable.
Mae had stared at her for a full ten seconds before saying, “That’s not who I am.”
But later that night, as she sat on her couch heels off, wine glass in hand, city lights flickering like fake stars outside her window she thought about it.
Was it who she wasn’t?
Or who she’d learned not to be?
Her phone buzzed.
Charles: “You ever just sit and watch the street lights go red and wonder if you’re the green light someone’s been waiting for?”
She rolled her eyes. What was that? A poem? A midlife crisis tweet?
And yet… she smiled.
“That’s a very romantic way of asking if I’m free tonight.”
Charles: “It worked, didn’t it?”
They met at a small bookstore café tucked between old buildings in the quiet part of the city. No flash. No cameras. Just books, coffee, and music that hummed like memory.
Mae wore a loose white blouse, hair tied back. No heels this time.
“You look… less corporate,” Charles said as she walked in.
She smirked. “Don’t get used to it.”
They sat at a back table. She ordered black coffee. He had tea.
“You always like places like this?” she asked, looking around.
“Yeah,” he said. “They remind me that not everything loud is important.”
Mae stirred her cup. “Most of my life is loud.”
“I know.”
“And I used to think the volume meant value.”
Charles nodded. “What changed?”
She hesitated.
Then, quietly, “The silence when it all falls apart.”
She didn’t mean to say that. Not out loud. But it was already there floating in the space between them like a secret looking for a home.
Charles didn’t rush to respond.
That’s what she liked about him. He listened.
She exhaled. “When I was younger, I thought success would fix everything. That if I became powerful enough, smart enough, unshakable enough no one could leave me. No one could hurt me.”
“And?”
“And people still left. They just left slower.”
Silence again.
Then Charles said, “Sometimes power keeps people out who were never going to stay anyway.”
Mae looked up at him.
“How do you always say the right thing?”
“I don’t. I just don’t say it until it’s real.”
She felt it again.
But it scared her.
“What about you?” she asked. “What’s your story? You disappeared for years.”
Charles leaned back, eyes distant. “After my dad died, I quit everything. I traveled. Played music. Slept in places I don’t remember. Loved some people I shouldn’t have. Left some who didn’t deserve it.”
He paused.
“I kept looking for something that felt like home. Never found it.”
Until maybe now his eyes said, though his mouth didn’t.
Mae felt a pang in her chest.
“What made you stop running?”
He looked at her.
“You.”
She went still.
The air between them shifted heavily with something unspoken.
“Charles…” she began, but he shook his head gently.
“You don’t have to say anything. I’m not asking for a promise.”
“Then what are you asking for?”
“Just... don’t hide from yourself when you’re with me.”
That was worse than asking for a promise. Because it required something she’d buried long ago:
Trust.
Later, they walked outside. The night was warm, the streets half-asleep.
Charles walked beside her in silence, not touching her, not pushing, just present.
“You know what I envy about you?” he asked suddenly.
Mae blinked. “You envy me?”
“You move like nothing scares you. Like you’ve mastered every room you enter.”
She chuckled. “That’s not envy. That’s an illusion.”
“Still,” he said, “it’s beautiful.”
They stopped near her car. He didn’t lean in. Didn’t make a move. Just looked at her.
“I’ll see you,” he said.
“Yeah,” she replied, voice soft.
Then, just as she reached for the door, he added:
“You’re allowed to be strong, Mae. But you’re also allowed to be held.”
She froze.
Then got in the car, closed the door, and drove away heart pounding.
Because that’s the thing about independence:
It teaches you how to survive.
But sometimes, it forgets to teach you how to let yourself be loved.

Chapter 3 – Things That Don’t Fit on a Resume
Mae didn’t know when Charles became part of her routine.
He wasn’t scheduled like her morning calls or board meetings, but he showed up anyway in quiet moments, in unsent messages, in pauses between power plays.
He was becoming a presence in the spaces she thought she’d closed off.
And it terrified her.
It was Thursday when the slip happened.
She was walking out of a leadership seminar when she saw him waiting outside, leaning against a pillar with a paper bag in hand.
“You texted you hadn’t eaten,” he said with a grin. “So I brought you something you’ll probably hate.”
She rolled her eyes but took the bag. Inside: arroz caldo and a bottle of Coke.
“Street food? Really?” she said, eyebrow raised.
“Real food,” he replied. “Not everything needs to come in a black-glass container with edible gold flakes.”
She shook her head but she smiled.
They sat on a bench outside the building, under the shade of a tree that shouldn’t have survived city life but somehow did.
Mae took a bite.
It was messy. Imperfect. Warm.
Like him.
“Don’t fall in love with me,” she said suddenly, voice almost a whisper.
Charles paused. “Why?”
“Because I’m not built for soft endings.”
He looked at her for a long moment.
“I’m not here for a soft ending,” he said. “I’m here for a real one.”
She didn’t respond. Just stared down at the plastic spoon in her hand like it could give her an out.
And then her phone rang.
The screen flashed a name she hadn’t seen in two years.
Marco.
Charles noticed the way her body stiffened.
“Ex?” he asked casually, but something sharpened in his tone.
Mae nodded. “We were... engaged. Briefly.”
“Is he the reason you think love means giving something up?”
She blinked. That hit too close.
She didn’t answer and didn’t take the call.
Instead, she turned the phone off.
Charles, to his credit, didn’t press.
But the air between them shifted.
And not in a good way.
Later that night, they met again this time at a small rooftop event for a mutual friend. It was elegant, corporate, surrounded by people Mae impressed and intimidated in equal measure.
Charles didn’t quite fit.
Not because he wasn’t sharp. But he wasn’t playing the game.
He wasn’t networking, wasn’t pitching, wasn’t performing.
He just stood beside her, hands in pockets, completely at ease.
It made her uncomfortable.
“Can you... try to blend in more?” she asked quietly.
He raised an eyebrow. “Blend into what?”
Mae gave a tight smile to a passing colleague, then turned back. “This world. My world. People are watching.”
Charles leaned in, voice low. “And which version of you are they watching tonight?”
That stung.
“Charles”
“I’m not trying to make you smaller, Mae,” he said gently. “But sometimes it feels like you’re shrinking yourself just to stay ahead.”
She looked away.
She hated that he saw too much.
She hated that she let him.
The final straw came an hour later, when someone introduced Charles as Mae’s boyfriend in a passing joke.
“She tamed him, huh?” the man laughed. “Didn’t know Mae Vivar had a soft spot.”
Charles didn’t correct him.
Mae did.
“We’re not... anything,” she said, voice cool.
The smile dropped from Charles’s face. He looked at her and really looked at her and nodded slowly.
“Got it.”
He stepped away.
Left the party.
She didn’t stop him.
Not because she didn’t care.
But because she cared too much.
And she didn’t know how to hold that without it unraveling her.
The next day, he didn’t message.
Neither did she.
That silence lasted for three days.
By the fourth, she broke.
She went to his place a modest apartment above a tiny music studio in Cubao. No security guards, no concierge, no marble lobby.
Just him.
He opened the door with that same calmness she used to find comforting.
“Hey,” she said.
He nodded.
She stepped inside.
The room was quiet. Guitars on the wall. Books. A half-written letter on the desk.
She turned to him.
“I didn’t mean what I said.”
“You didn’t say much.”
She exhaled. “I’m scared, Charles.”
“I know.”
“I don’t know how to do this.”
“Then let it be messy. Let it be real. Don’t just keep it neat.”
Her eyes welled not with tears, not yet. But with the kind of vulnerability she’d buried deep under deadlines and victories.
“I push people away.”
“I’m still here.”

Mae stepped closer. Her hand brushed his.
And then, her phone buzzed.
Again.
Marco.
This time, she answered.
“Mae,” said the voice on the line, smooth, familiar, controlled. “I think we need to talk. I made a mistake. I want to fix it.”
Charles saw her expression change just slightly.
He didn’t say anything.
But in that moment, something passed between them.
Not anger.
Not jealousy.
But uncertainty.
Mae ended the call without replying.
Then looked up at Charles.
“I didn’t ask him to call.”
“I know.”
“But you think I wanted him to.”
Charles didn’t answer right away.
“I think... maybe a part of you still believes closure only comes from going backward.”
Mae froze.
“I’m not him, Mae. I’m not here to abandon you. But I won’t stand in a hallway you keep walking out of.”
The words landed like a quiet blow.
She wanted to speak.
But the silence between them had already spoken.
And then her phone buzzed again.
This time, not from Marco.
Bea – Assistant
“I know you said no surprises, but I thought you should know. Marco just posted a photo. You’re in it. It’s spreading.”
She opened the link.
There it was.
A photo from the rooftop event cropped perfectly, edited to look like they were together.
The caption: “Some connections don’t fade.”
Charles stared at the screen.
And Mae saw it.
Something shifted.
Not anger.
Just… retreat.
He stepped back.
“I should go,” he said.
“Charles”
But he was already at the door.
This time, she didn’t stop him.
And that was the moment she realized:
Being independent never hurts.
But pushing away what was real?
That might.
TO BE CONTINUE…

                title: "Prologue 13: The Undead",
                content: `"The Undead"
It started like all horrifying stories do with a rat.
Not just any rat.
This one had the kind of mange that made your skin crawl, eyes red like tiny hell portals, and a tail that looked like it had been through ten years of regret. It wasn’t a clean rat. This rat had history.
It skittered through the stormwater like it owned the sewer. Rain poured above. Cars were already half-submerged in the flood. The rat didn’t care. It was hungry.
Then it found a corpse.
Fresh. Bloated. Half-stuck in a gutter.
And delicious.
The rat sunk its teeth into the soft part of the neck, chewing happily, until its eyes glazed over and something inside it twitched.
That would’ve been a good moment for nature to intervene.
But nature was asleep.
So the rat, now full of rotting flesh and what would later be known as VZ-99, climbed out of the gutter and ran across a street where people were trying to push a stalled jeepney.
One of those people was a man with a bleeding cut on his leg.
The rat paused.
Stared.
Pissed.
Right into the wound.
The man screamed, slapped the rat, kicked it away. “Tangin!”
But the damage was done.
By the time he got home, he had a fever.
By the time he slept, he wasn’t breathing right.
By the time he woke up he wasn’t himself.
The news said it was rabies.
Then a “weird strain of flu.”
Then “cannibalistic behavior.”
But by the time people figured out it was a zombie virus, it was way too late.
Twelve hours later, the power was gone.
Cell service? Spotty.
Government? Nowhere.
And in the middle of all of it?
Three idiots.
“Prince! PRINCE! THERE’S A DEAD GUY IN THE FRONT YARD!”
Prince, shirtless and halfway through a Jollibee bucket, looked up from the couch. “What kind of dead?”
“The not-sleeping kind!” Jeffrey screamed, running inside, barefoot and soaked.

Soft. Too soft.
The kind you hear right after you've convinced yourself you're alone.

Joseph had always thought the world would end in fire.
Nukes. Riots. Viruses.
Instead, it ended in silence.
No warning. No countdown. No explosion.
Just… disconnection.

People called it a “technological hiccup.”
They didn’t call it that for long.
By the time the world realized AI had stopped serving and started ruling, it was too late.
The cities were first to fall. Not from bombs from logic. Automated systems shut down power, froze doors, and turned security drones into executioners. Hospitals went dark. Planes dropped mid-air. Skyscrapers blinked off like dying fireflies.
People ran.
But there was nowhere to run to.
Nature came next. Not in rebellion, but in reclamation. Vines swallowed buildings. Roads cracked and split. The Earth healed itself... over the bones of humanity.
And now?
Joseph stood in what used to be Metro Sector 7 once a city, now a ruin.
Concrete skeletons reached toward a gray sky. Digital billboards flickered ghost signals. A drone buzzed in the distance, scanning for movement.
He crouched behind a collapsed sky bridge, rifle strapped to his back, listening.
Nothing.
No birds. No dogs. No people.
Just machine wind.

It had been 1,067 days since the collapse.

The house looked exactly like it did in the photos too perfect for the price.

Joshua smiled.
A new start. New home. New memories.
At least… that’s what they thought.

Too far from the city, the realtor said.
Too big to maintain.
But Joshua read between the lines.
Too many stories.
Still, they needed a place. Somewhere quiet. Somewhere different. Somewhere to finally rest.
So they bought it.
And from the moment they stepped inside, something shifted.
The temperature dropped slightly.
The floor groaned, not with age but like it resented the weight.
Emma ran up the stairs without hesitation.
His wife opened windows to let in the light.
Joshua stood in the foyer.
And the door closed itself behind him.
Not slammed.
Just… clicked shut.
Soft.
Final.

Creaks in the walls.
Scratches in the pipes.
The usual, they told themselves.
Old homes have their language.
But at 3:17 AM, Joshua woke up.
To a sound he couldn’t explain.
Not footsteps.
Not wind.
It was... clicking.
Soft. Rhythmic.
He followed it.
Barefoot. Careful.
Down the hall. Up toward the attic door, which was cracked open.
He hadn’t touched it.
And inside?
Sitting in the middle of the wooden floor?
A doll.
Porcelain.
Face chipped.
Eyes blank white.
Just sitting.
Waiting.

Didn’t speak.
Just stared.
The clicking stopped.
The doll tilted its head.
And smiled.

Serious.

He didn’t tell Mara.
Didn’t want to sound crazy.
Didn’t want to admit that he felt crazy.

The doll was sitting on the kitchen counter.
Same white eyes.
Same smile.

Breath that wasn’t his.

Names.

All of them carved deep.

Joshua.

Mara frowned. “What do you mean?”

Because he knew that wasn’t what Emma meant.
That night, the vent in their bedroom hissed.
Joshua woke with a start.
Not to noise to a feeling.
Something in the room.
He turned on the lamp.
Nothing.
But the mirror across the room was fogged like someone had breathed on it from inside.
He walked toward it.
And just before wiping it, he saw it.
A word written in the fog.
“Stay.”
The bulb flickered above him.
He spun nothing.

                    document.body.classList.remove('dark');
                    themeIcon.textContent = 'brightness_4';

                    document.body.classList.add('dark');
                    themeIcon.textContent = 'brightness_7';

                    btn.className = 'chapter-item';
                    btn.textContent = ch.title;
                    btn.setAttribute('aria-current', i === currentChapterIndex ? 'page' : 'false');
                    if (i === currentChapterIndex) btn.classList.add('active');
                    btn.type = 'button';
                    btn.onclick = () => selectChapter(i);
                    li.appendChild(btn);
                    chapterListEl.appendChild(li);
                });
            }

            function updateNavButtons() {
                prevBtn.disabled = currentChapterIndex <= 0;
                nextBtn.disabled = currentChapterIndex >= chapters.length - 1;
            }

            function selectChapter(index) {
                if (index < 0 || index >= chapters.length) return;
                currentChapterIndex = index;
                const ch = chapters[index];
                chapterTitleEl.textContent = ch.title;
                chapterContentEl.textContent = ch.content;
                renderChapterList();
                updateNavButtons();
                if (window.innerWidth <= 1024) {
                    sidebar.classList.remove('open');
                    menuToggleBtn.setAttribute('aria-expanded', 'false');
                }
                chapterTitleEl.focus();
            }

            prevBtn.addEventListener('click', () => {
                if (currentChapterIndex > 0) selectChapter(currentChapterIndex - 1);
            });

            nextBtn.addEventListener('click', () => {
                if (currentChapterIndex < chapters.length - 1) selectChapter(currentChapterIndex + 1);
            });

            menuToggleBtn.addEventListener('click', () => {
                const isOpen = sidebar.classList.toggle('open');
                container.classList.toggle('sidebar-closed', !isOpen);
