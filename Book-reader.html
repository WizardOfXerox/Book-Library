    <script>
        function breakAfterSentences(containerId, sentencesPerBreak = 5) {
            const container = document.getElementById(containerId);
            const text = container.textContent;
            const sentences = text.match(/[^.!?]+[.!?]+["']?\s*/g); // Matches sentences
            if (!sentences) return;

            let result = '';
            sentences.forEach((sentence, i) => {
                result += sentence.trim();
                if ((i + 1) % sentencesPerBreak === 0 && i !== sentences.length - 1) {
                    result += '<br><br>';
                } else {
                    result += ' ';
                }
            });

            container.innerHTML = result.trim();
        }

        // Run this after chapter content is loaded (example: after selecting a chapter)
        document.addEventListener('DOMContentLoaded', () => {
            breakAfterSentences('chapterContent', 5);
        });

That line had been echoing in Phil Knight’s mind for years long before Nike was a household name, long before investors called him a genius. He sat now on a weathered bench by the same running track where it had all started. It wasn’t Olympic-grade. It wasn’t perfect. But it had something more important: it had memory. Sweat. Struggle. Ambition. It had the soul of something sacred.
Back in 1964, Phil wasn’t a CEO. He wasn’t a millionaire. He was a runner. A son. A man clinging to an idea so fragile, the world laughed at it.
But to Phil, it wasn’t just an idea. It was a calling.
That same track at the University of Oregon bore the footprints of a man who would become both mentor and tormentor Bill Bowerman. The coach. The innovator. The relentless perfectionist. To many, he was terrifying. To Phil, he was essential.
“You don’t win by pushing harder,” Bowerman had once told him, examining a poorly made prototype.
 “You win by being smarter. Your mind, your feet, and yes what’s under your feet. That matters most.”
They argued often. Sometimes bitterly. But behind the friction was a strange form of respect two men who didn’t always agree, but who understood that friction creates fire.
Then there was Carl Joseph. A former track athlete with Olympic dreams that never came true, Carl was the quiet constant behind the scenes. He wasn’t in the history books. But he tested the shoes. He ran in the failures. He helped build the dream when it was still just duct tape and instinct.
1964.
The sun hadn’t even risen when Phil first asked himself the question that would haunt and guide him:
“What if running is more than just running?”
Back then, he sold Japanese running shoes Onitsuka Tigers out of the trunk of his car. No office. No warehouse. Just one man, a trunk full of shoes, and a gut feeling that the world needed something better.
Every time he made a sale, he’d call Bowerman.
“Coach! I sold twenty this week!”
“Good. Not enough. We need better soles.”
There were no pats on the back. No “Good job.” Just relentless pressure. But that pressure molded Phil. It sharpened him.
The turning point came with a waffle iron Mrs. Bowerman’s, to be exact. Bowerman melted rubber and poured it into the iron like some mad scientist in a garage laboratory. Smoke filled the air. The kitchen reeked of burnt rubber. But something extraordinary happened.
It didn’t work at first. The rubber stuck. Shoes caught fire. A few prototypes were disasters.
But then one day it worked.
A sole like no other. Light. Grippy. Revolutionary.
That waffle iron became a legend. Not because it cooked breakfast, but because it cooked the future.
It wasn’t just about making shoes. It was about giving people a chance, a chance to run faster, push farther, and believe in something bigger than themselves.
2025.
Now in his late years, Phil Knight stands at the heart of Nike’s global campus in Beaverton, Oregon. The buildings gleam. The walls are lined with records, jerseys, and slogans that moved millions. But Phil’s eyes aren’t on the lights.
He’s staring at a brick wall where three names are engraved: Bowerman. Joseph. Knight.
In his coat pocket, he carries a folded note aged, fragile. Written in 1962, when he was still a dreamer with no map.
“Sell 50 shoes a week.
Build my own brand.
Make something that lasts.”

And in every sole worn by a runner, in every starting line where a heart pounds against ribcage there’s a trace of those first steps.
Because since 1964, they didn’t just run.
They flew.

Chapter 1 — The Track Before the Storm

The air in Tokyo was heavy that morning, dense with humidity, tension, and an odd sense of fate. Phil Knight stepped off the train, clutching his suitcase like it contained his future. In many ways, it did.
Inside were notes, sketches, and a marketing plan for an idea most people back home dismissed as foolish: importing Japanese running shoes to the United States. The company didn’t even exist yet. Just a name he scribbled in a notebook on the flight over: Blue Ribbon Sports.
He wasn’t a businessman, not really. He was still a young man fresh out of Stanford, wrestling with his own doubts. He had read every book, studied every trend, and still nothing felt real until now. Until the moment he stepped into Onitsuka Co. Ltd. to meet with executives he had only ever read about in industry magazines.
“We’re not looking for American partners,” one man said sternly through a translator.
“Why should we trust a young man with no store, no capital, and no experience?”
Phil could feel his pulse hammering. But fear had no place in this room.
“Because I believe in the product,” he answered. “And I believe American athletes will too.”
He expected laughter. Dismissal. Maybe even security.
Instead, silence.
Then a handshake.
And that’s how it started. With a handshake in Japan and a trunk full of promise.
Back in Oregon, things weren’t any easier.
Phil still lived with his parents. He worked as an accountant by day and pursued his shoe business by night. His father, a respected publisher, was skeptical at best. His mother, quietly supportive. But no one really understood what Phil saw.
That it wasn’t just about shoes.
It was about movement. About possibility.
Enter Carl Joseph, a former college runner with a busted knee and a quiet fire in his eyes. Carl had seen Phil at meets before, never close enough to talk, always close enough to notice. When he heard about the guy selling Japanese shoes, curiosity led him to the trunk of a car in a dimly lit parking lot.
“These yours?” Carl asked, picking up a pair of Tigers.
“They’re Onitsuka’s. But I bring them in,” Phil replied. “Try them on.”
Carl laced them up and jogged a short lap on the gravel lot. When he stopped, he said only one word.
“Damn.”
That night, they had coffee. Then more laps. Then more ideas. Carl became Phil’s first test runner. First unofficial employee. First believer.
While Phil sold out of the trunk, another battle raged between legacy and innovation.
Bill Bowerman still ruled the University of Oregon’s track program with military precision. He hated gimmicks. He hated hype. But what he loved and what he respected was performance. And when Phil handed him a pair of Tigers, Bowerman didn’t speak. He tore them apart. Literally. Dissected them on his workbench. Measured their flaws.
Days later, he called Phil back.
“We can do better,” Bowerman said flatly.
“Excuse me?”
“You heard me. The midsole’s too thick. The arch needs more give. And the heel drags. But... there’s potential. Let’s improve it.”
It wasn’t approved. It was a challenge.
And Phil knew better than to say no.
Thus began the unlikely partnership: the dreamer and the coach. One obsessed with possibility. The other with perfection.
They worked in garages, in basements, in the Bowermans' kitchen. Shoe prototypes littered the floor like battlefield casualties. Some melted. Some cracked. Some almost broke their testers’ ankles.
But they learned.
Every mistake was fuel.
One night, after a grueling session testing out a failed arch design, Carl sat outside Phil’s house, shoes off, feet blistered.
“Are we crazy?” he asked.
“Yes,” Phil said without hesitation.
“But if we weren’t, this wouldn’t mean anything.”
They laughed, not because it was funny but because if they didn’t, they might collapse under the pressure.
By now, the name “Blue Ribbon Sports” had trickled into conversations at track meets. Athletes were asking questions. Coaches were taking notice. Still, orders were slow. Money was tight. Every sale felt like life support.
Phil began taking bigger risks borrowing money, quitting his job, and investing in materials. His nights were sleepless. His hands calloused. But his vision never faded.
He wasn’t chasing money. He was chasing momentum.
Then, one day, it happened.
A runner from UCLA won a major meet wearing Blue Ribbon’s modified Onitsukas.
The press noticed.
So did the public.
Phil’s phone rang constantly. Stores began placing bulk orders. The trunk of his car could no longer keep up.
They were on the cusp of something. Not a breakthrough. Not yet. But the tension had shifted from “what if this fails” to “what if we really pull this off?”
Phil stood one morning in front of the garage, shoes lined up neatly like soldiers before battle.
“We’re not just selling shoes,” he told Carl.
“We’re building the soul of something bigger.”
Carl nodded. “So what comes next?”
Phil didn’t know the answer. Not exactly.
But the wind that morning carried the same weight as it had in Tokyo—that sense of something rising, just out of reach.
Something worth chasing.

Chapter 2 — Shadows Under the Ribbon

Phil stared at the ceiling fan turning slowly above his bed. Another sleepless night. The kind that made his bones ache and his thoughts louder than the silence.
Blue Ribbon Sports was growing. On paper, it looked like a victory more sales, new athletes, broader demand. But Phil knew better.
The company was still a string of duct-taped risks held together by hope and stubbornness. The money coming in barely covered the orders going out. His bank account was on life support. Every dollar had a destination. Every decision carried weight.
And something about Onitsuka was… off.
Their shipments had started arriving late. Some came damaged. Others didn’t come at all. Phil’s polite follow-ups turned into firm letters. Those firm letters turned into ignored ones.
He had no leverage. No factory. No backup.
All he had was belief.
One cold morning, while Carl unloaded boxes into a cramped downtown office space, he turned to Phil and said, “I feel like we’re selling someone else’s dream.”
Phil froze.
Carl didn’t mean it as an insult. But the words stung. Because part of it was true.
They were building an empire on someone else’s shoes.
And the thought had been creeping into Phil’s mind for months: What happens if Onitsuka pulls the plug?
That wasn’t a possibility.
That was a ticking clock.
Bill Bowerman felt it too.
He had stopped dissecting Onitsuka shoes. He had started designing his own.
Sheets of notebook paper covered his kitchen table—hand-drawn soles, experiments with waffle irons, laces that looped differently. Bill wasn’t waiting for a manufacturer’s blessing. He was creating from the ground up.
“They’re not innovators,” he said bluntly one afternoon.
“They’re retailers. You? You want to be more than that.”
Phil nodded. He wanted to say yes. But there were complications.
Contracts. Commitments. Loyalties.
But dreams, Phil had learned, don’t ask for permission. They press forward, whether you’re ready or not.
That summer, a strange letter arrived.
It was from a competitor someone Phil barely knew. He had heard whispers about an upcoming deal between Onitsuka and another U.S. distributor. A replacement.
Phil drove to the coast that night. Alone. No music. Just wind and crashing waves as company. He parked and walked to the shoreline, letting the cold sting his face. Every failure he feared now felt real.
They’re replacing me.
The words hit like stones.
He screamed into the surf, unheard by anyone but himself.
“I gave them everything.”
Back in Portland, Carl saw the change immediately. Phil was quieter. Sharper. Like someone had turned the dial inside him from hopeful to resolute.
“What are you thinking?” Carl asked.
“I’m thinking it’s time we stop pretending we’re a middleman.”
Carl blinked. “You mean…?”
Phil nodded. “It’s time we make our own shoes.”
They didn’t have a factory. They didn’t have machinery. But they had something more powerful:
Conviction.
They reached out to suppliers in Mexico, Taiwan, even South Korea. Phil wrote letters. Cold-called factories. Some laughed him off. Some didn’t respond at all. But a few listened.
And one just one agreed to a prototype deal.
It wasn’t perfect. But it was theirs.
Bowerman’s waffle sole design was finally coming to life. Lighter, grippier, faster. Something that could change a runner’s game. Something the world hadn’t seen yet.
The only problem?
They had no name.
They tossed ideas around in the office for days. Names that sounded like insurance companies. Some like toothpaste brands. None that fit.
One night, half-asleep on his typewriter, Phil whispered, “Dimension Six.”
Carl choked on his drink.
“That sounds like a disco band.”
Everyone hated it. Phil included.
But they were running out of time. The factory needed a name. The boxes needed a logo.
Then, one morning, a temp worker Jeff Johnson, the obsessive track nut and marketing guy called and said:
“I had a dream last night. About the Greek goddess of victory. Her name was Nike.”
Silence.
“You mean Nike like Nikey?”
“No, just Nike.”
It was short. Punchy. Mythic. And paired with the swoosh a simple tick, a symbol of motion it had something no other name had.
Movement.
They submitted the name that day. The logo was sketched for just $35 by a student. The moment wasn’t grand. It wasn’t cinematic.
But something had shifted.
The ribbon had been cut.
Phil still hadn’t told Onitsuka. He couldn’t. Not yet.
He was living a double life still selling their shoes while secretly building their replacement. A dangerous game of patience and precision.
Then, the letter came.
From Onitsuka’s legal department.
A polite but clear termination of the partnership.
No apology. No explanation.
Just an ending.
Phil stood in the middle of the new office, the letter trembling in his hand.
“This is it,” he muttered.
“We fly or we fall.”
Carl looked over from the back room. “Then we better fly.”
By fall of 1971, their first Nike shipments had arrived. The smell of new rubber. The crispness of fresh branding. It was real now.
They gave away pairs at track meets. Runners talked. Coaches whispered. Some hated the look. Others said the fit was unlike anything before.
The track was shifting.
And in the middle of it, Phil Knight stood not as a middleman anymore, but as a founder.
He wasn’t sure if this would work. But for the first time in years, he wasn’t waiting on anyone else.
He was building something of his own.

Chapter 3 – The Swoosh Breaks the Silence

The boxes arrived on a gray morning.
Unassuming. Brown cardboard. Stamped with a word that, until now, meant nothing to anyone:
Nike.
Phil Knight stood beside the delivery truck, watching as Carl and a few interns unloaded the first shipment. A thousand pairs. Their own creation. The factory’s craftsmanship was raw but real. Some boxes were scuffed. A few soles were uneven.
But they were theirs.
Phil picked up a pair and held it in his hands. Waffle sole. Synthetic upper. The swoosh curled confidently across the side like a silent promise. The shoe didn’t scream. It whispered.
“We belong here.”
Still, the world wasn’t waiting for them.
The running scene was insular. Athletes trusted what they knew. Adidas. Puma. Onitsuka. Nike? It sounded like a myth. It was a myth.
Phil knew that breaking through wouldn’t require good shoes alone. It needed faith the kind that only stories, timing, and people could build.
Enter Steve Prefontaine.
Bowerman introduced them one afternoon on a humid Oregon track. Steve was a fireball in spikes reckless, hungry, uncoachable in the best and worst ways. His races were electric. He ran not to win, but to dominate.
Bowerman handed him a pair of Nike spikes, freshly molded. Prefontaine squinted at them like someone handed him a science project.
“Are these even legal?”
Bowerman smirked. “Run a lap. You tell me.”
Steve did. And by the second curve, he was grinning.
“They’re light as sin.”
That’s all Phil needed to hear.
With Pre on board, things accelerated. Word spread. Local athletes began calling Blue Ribbon’s new office, asking for “the Nike ones.”
Phil could feel momentum shifting but it wasn’t smooth. It was erratic, chaotic, unpredictable.
Orders doubled, then tripled.
Factories fell behind.
Mistakes piled up.
One shipment to New York was mislabeled and lost entirely. Several dealers returned boxes claiming the swoosh looked “weird.” A shoe even melted on a track in Fresno during a hot-day race.
Phil took it personally. Every return, every insult felt like a punch to the ribs.
But he refused to flinch.
In a rented hotel room in Chicago, Phil met with a skeptical sports distributor.
The man leaned back in his chair, arms folded.
“So this Nike… it’s yours?”
“Yes.”
“And you say it’s better than Adidas?”
“Not just better. Smarter. Lighter. Built by runners, not by corporations.”
The man chuckled.
“You’ve got balls, I’ll give you that.”
Phil didn’t smile.
“No, I’ve got belief. The rest will come.”
Back in Oregon, things weren’t as firm.
Carl was burned out working nights, handling inventory chaos. One evening, he slammed down a box and said, “We’re scaling too fast. Too messy. We’re building an empire with duct tape.”
Phil nodded slowly.
“I know.”
“Do you?” Carl snapped.
“Because if we crash, it’s not just your name on the papers. It’s all of us.”
Phil looked at the stack of invoices on the desk. Unpaid. Looming. He didn’t answer.
He couldn’t. Because Carl was right.
That night, Phil went on a solo drive along the coast. Same spot where he had screamed into the waves months ago.
But this time, he didn’t scream.
He stood quietly, shoes in hand.
He placed one on the sand and stepped back, watching the swoosh reflect the moonlight.
He whispered, “We’re not supposed to be here. But here we are.”
Then he picked up the shoe and left.
Summer of 1972.
The Olympic Trials.
Nike didn’t have a booth. They weren’t on banners. But their shoes were on feet. Real athletes. Real races.
Steve Prefontaine ran in them, again and again, drawing attention not just for his brutal pacing, but for those mysterious curved logos on his spikes.

Now she was asking him to choose between her life and everything he'd built.
"How did we get here?" she whispered, and Carl realized she wasn't really asking him. She was asking herself, asking the universe, asking whatever god watched over fools and criminals.
Carl closed his eyes and remembered pizza boxes. Remembered the weight of coins in his pocket that never added up to enough. Remembered the way people looked through him like he didn't exist, like he was just another invisible poor kid who'd never amount to anything.
He remembered the exact moment he'd decided to prove them all wrong.
And he remembered the first time he'd held a gun, how the weight of it had felt like destiny in his hands.
"One minute, Santos. I won't ask again."
The sirens were getting closer now. Soon this warehouse would be crawling with cops, SWAT teams, reporters. They'd paint Carl as another street thug who'd gotten in over his head, another cautionary tale about the dangers of easy money. They'd never understand that this wasn't about the money at all.
This was about becoming someone who mattered.
Carl looked at Michelle, at the blood spreading across her shirt, at the trust still shining in her eyes despite everything he'd put her through. Then he looked at the duffel bag, at the future it represented.
Some choices define a man's entire life.
This was one of them.

CHAPTER 1: MINIMUM WAGE
Six months earlier
The pizza was cold by the time Carl Santos reached the thirty-second floor of the Makati Business District high-rise, sweat dripping down his back despite the building's aggressive air conditioning. He'd made this same delivery run dozens of times overpriced Italian food to overworked executives who barely looked up from their phones long enough to sign the receipt.
"You're late," the receptionist said without looking up from her computer screen. She was maybe twenty-five, perfectly made up, wearing a blouse that probably cost more than Carl made in a month. Her manicured nails clicked against the keyboard with the rhythm of casual indifference.
"Traffic," Carl said, setting the insulated bag on her pristine desk. "Fifteen minutes in the elevator alone."
She finally looked at him, taking in his faded delivery uniform and motorcycle helmet tucked under his arm. Her expression was the one Carl had grown accustomed to the look people gave to service workers, a mixture of mild annoyance and complete dismissal.
"The order's supposed to arrive hot," she said, pulling out her phone to take a picture of the food. "I'm going to have to report this."
Carl felt his jaw tighten. "Ma'am, I left the shop twenty minutes ago. The traffic from "
"I don't need excuses. I need service." She handed him a crumpled receipt without a tip line filled out. "You can go."
The elevator ride down felt longer than the ride up. Carl stared at his reflection in the polished steel doors twenty-four years old, lean from missed meals and long hours on his motorcycle, with the kind of tired eyes that came from working two jobs and still coming up short every month. His mother needed medication. His younger sister needed school supplies. The rent was due in three days, and he was exactly 2,847 pesos short.
Again.
The motorcycle traffic through Makati was its usual nightmare: jeepneys belching black smoke, cars with tinted windows that cost more than most people's houses, pedestrians weaving between vehicles like they were playing a deadly game. Carl had been navigating these streets for two years now, ever since he'd dropped out of college to help support his family. The city had a way of reminding you exactly where you stood in its hierarchy, and guys who delivered pizza ranked somewhere below street cleaners.
His phone buzzed as he pulled up to the next delivery address. Michelle's name flashed on the screen.
"Nasa'n ka na?" her voice was warm, familiar, the one bright spot in his increasingly gray days.
"Delivering to BGC. Rich kids who probably spent more on lunch than I make in a week." Carl balanced the phone between his shoulder and ear while unloading another order. "Are you still coming over tonight?"
"Of course. Mom's making adobo, and she made enough for an army. Plus, I want to hear about your interview yesterday."
Carl's stomach clenched. The interview. The security guard position at a mall that would pay slightly better than pizza delivery but require him to stand in one spot for twelve hours a day, watching rich people buy things he'd never afford. "It went fine. They said they'd call."
"That's great! See? I told you things were going to start looking up."
Michelle's optimism was one of the things Carl loved most about her, and also one of the things that frustrated him most. She'd grown up in the same neighborhood, dealt with the same struggles, but somehow she'd managed to keep believing that hard work and good intentions would eventually pay off. Carl had believed that once too, back when he'd thought his marketing degree would be his ticket out of Tondo.
Now he knew better.
The BGC delivery was to a condominium that probably cost more per month than most people made in a year. The security guard, a guy about Carl's age in a crisp uniform, looked him up and down with professional suspicion.
"Delivery for unit 4205," Carl said, showing his ID.
"They're expecting you. Thirty-second floor." The guard's tone was neutral but his eyes held a message Carl had learned to read: You don't belong here.
The condo's owner was a kid, maybe nineteen or twenty, wearing designer clothes and sporting the kind of expensive watch that could feed a family for months. He answered the door while talking on his phone, gesturing impatiently for Carl to come in.
"No, Dad, I told you the Porsche is in the shop," the kid was saying, pulling out a thick roll of cash to pay for the food. "I'm using the BMW this week. It's fine."
Carl counted out the change, but the kid waved him away, still talking. "Keep it," he said dismissively, then paused his phone conversation. "Actually, wait. You want to make some real money?"
The question caught Carl off-guard. "Sir?"
"Real money. Not this delivery bullshit." The kid's eyes were sharp now, calculating. "You look like someone who could use an opportunity."
Carl felt something shift in his chest, a quickening of pulse that he'd later recognize as the moment his life took its first step toward disaster. "What kind of opportunity?"
"The kind where you make more in one night than you do in a month riding around on that bike." The kid walked to his window, looking out at the glittering city below. "I've got friends who need reliable people. Discrete people. People who know how to keep their mouths shut and follow simple instructions."
"What kind of instructions?"
The kid turned back to him, smiling. "The kind that pays really, really well."
Carl should have left then. Should have taken his 200-peso delivery fee and walked away. Should have gone home to Michelle and his mother's adobo and been grateful for what he had. Instead, he heard himself asking, "How much money are we talking about?"
"Tonight? Five thousand pesos for two hours of work. No questions asked, no complications. Just drive from point A to point B and deliver a package. Think of it as premium pizza delivery."
Five thousand pesos. More than Carl made in a week of burning gas and dealing with rude customers. More than enough to cover the rent shortage. More than enough to buy his mother's medication and his sister's school supplies without having to choose between them.
"What's in the package?"
The kid's smile widened. "Does it matter?"
And that was the exact moment when Carl Santos made the choice that would change everything. He could feel it happening, could sense the trajectory of his life shifting like a car sliding on wet pavement. But five thousand pesos was five thousand pesos, and he was so tired of being broke, so tired of being invisible, so tired of watching other people live the life he wanted while he scraped by on the margins.
"When do we start?" he heard himself say.
Three hours later, Carl was sitting in a coffee shop in Quezon City, a nondescript backpack at his feet and more cash in his pocket than he'd ever held at one time. The drop-off had been simple drive to a location, hand over the package, drive away. He hadn't asked what was inside, and no one had volunteered the information.
But he knew. Deep down, in the part of his brain that still functioned on logic and self-preservation, he knew exactly what kind of business paid five thousand pesos for two hours of courier work.
His phone buzzed. A text from an unknown number: "Good work tonight. Same time tomorrow? 7K this time."
Carl stared at the message for a long time, watching the cursor blink after the question mark. Seven thousand pesos. In two hours. For a job that required nothing more than driving from one place to another.
He thought about Michelle, about the trust in her eyes when she talked about their future together. He thought about his mother, counting pills to make her medication last longer. He thought about the rich kid in the BGC condo, casually throwing around more money than Carl's family saw in months.
The city lights sparkled beyond the coffee shop window, beautiful and cold and completely indifferent to the struggles of people like Carl Santos. Somewhere in those lights, people were making millions while he delivered their food for pocket change. Somewhere in those lights, opportunities existed for people brave enough or desperate enough to take them.
Carl typed back: "Same time tomorrow."
He hit send before he could change his mind.
Outside, Metro Manila hummed with the energy of eight million people chasing their dreams, fighting their demons, making choices that would define the rest of their lives. Most of them would wake up tomorrow in the same circumstances they'd gone to bed with tonight.
But Carl Santos had just taken his first step toward becoming someone different.
Whether that someone would be better or worse remained to be seen.
His phone buzzed again. Michelle: "Can't wait to see you tonight. Love you."
Carl stared at the message until the screen went dark, his reflection looking back at him from the black surface. He looked the same as he had that morning, same face, same eyes, same delivery uniform. But something fundamental had changed, something invisible but irreversible.
Tomorrow, he will tell Michelle about the security guard interview. He would eat his mother's adobo and help his sister with her homework and pretend that everything was normal.
But tomorrow night, he would also drive across the city with another package, another payday, another step away from the life he'd known and toward something he couldn't yet imagine.
The money in his pocket felt heavier than it should have, weighted with possibilities and consequences in equal measure.
Carl Santos was about to learn that some opportunities came with a price that couldn't be calculated in pesos.

CHAPTER 2: DEEPER WATERS
Three weeks into his new side business, Carl had made more money than he'd earned in the previous six months of pizza delivery combined. The routine had become almost mundane: pick up packages from various locations around the city, deliver them to other locations, ask no questions, collect payment. Simple. Clean. Profitable.
But nothing stayed simple for long in the world Carl was entering.
"We need to talk," the kid from BGC who'd introduced himself only as "Rico" said over the phone on a Tuesday evening. "Meet me at the usual place in an hour. And Carl? Bring your girlfriend."
The line went dead before Carl could ask why Michelle needed to be involved. She was waiting for him at a McDonald's in Cubao, studying for her nursing exams, textbooks spread across a table sticky with spilled drinks and the dreams of people who couldn't afford better study spaces.
"We need to go," Carl said, sliding into the seat across from her.
Michelle looked up, noting the tension in his voice. Over the past few weeks, she'd noticed changes in Carl's new clothes, a new phone, the way he no longer stressed about money the way he used to. When she'd asked, he'd told her about odd jobs, occasional handyman work for a construction company. She'd wanted to believe him.
"Go where? I have an exam tomorrow."
"Rico wants to meet both of us. It's about work."
"The construction work?" There was something careful in her voice, a wariness that hadn't been there before.
Carl nodded, not trusting himself to elaborate on the lie. "It'll be quick. I promise."
They rode Carl's motorcycle through the evening traffic to a bar in Malate not the kind of place college students from Tondo usually frequented. The interior was dim, expensive, filled with the kind of people who conducted business in shadows and spoke in codes. Rico was waiting in a corner booth, but he wasn't alone.
The man sitting across from him was older, maybe forty, with the kind of stillness that suggested violence was always an option. His suit was impeccable, his watch was worth more than most cars, and his eyes missed nothing as Carl and Michelle approached.
"Carl, Michelle," Rico said, gesturing for them to sit. "I'd like you to meet Mr. Valdez. He's the one who's been providing your recent opportunities."
Valdez studied them both with the clinical interest of a scientist examining specimens. When he spoke, his voice was soft, cultured, the kind of accent that came from expensive schools and foreign travel.
"Rico tells me you've been reliable," Valdez said to Carl, then turned his attention to Michelle. "And you, my dear, are studying nursing?"
Michelle nodded, suddenly very aware that she was out of her depth. "Yes, sir. I graduate next year."
"Excellent. Healthcare is a growing field." Valdez smiled, but it didn't reach his eyes. "Carl, I have a proposition for you. The work you've been doing courier services has been satisfactory. But I have an opportunity for something more substantial. More profitable."
"What kind of opportunity?" Carl asked, though part of him already knew he wouldn't like the answer.
"The kind that requires trust. Commitment. And occasionally, a steady hand." Valdez slid a business card across the table. It was blank except for a phone number. "I run a pharmaceutical distribution business. Specialty medications for clients who prefer... discretion in their healthcare choices."
Carl felt Michelle tense beside him. She was smart enough to read between the lines, to understand what "specialty medications" meant in a conversation that took place in shadowy bars with men who wore expensive suits and spoke in euphemisms.
"I'm not sure that's something I'd be interested in," Carl said carefully.
Valdez's smile widened. "I haven't told you the compensation yet. Twenty-five thousand pesos per delivery. Two deliveries per week, guaranteed. That's fifty thousand pesos per week, Carl. More than you'd make in a year doing... whatever it is you were doing before."
The number hit Carl like a physical blow. Fifty thousand pesos per week. In a month, he could pay off his family's debts, get his mother proper medical care, maybe even help Michelle finish nursing school without her having to work nights at the call center.
"What exactly would I be delivering?" he heard himself ask.
"Products. Clients. Sometimes both." Valdez's tone remained conversational, as if they were discussing the weather. "The details aren't important. What matters is reliability, discretion, and the ability to follow instructions without asking unnecessary questions."
Michelle's hand found Carl's under the table, her grip tight with warning. "Carl, maybe we should "
"The young lady is wise to be cautious," Valdez interrupted smoothly. "Which is why I have a proposal for her as well. My organization occasionally requires medical expertise. Informal consultations, you might say. Treatment for clients who prefer to avoid traditional healthcare channels."
"You want me to treat criminals," Michelle said flatly.
"I want you to help people who have limited options," Valdez corrected. "For which you would be compensated quite generously. Fifteen thousand pesos per consultation."
Carl's mind was racing. Combined, they could make sixty-five thousand pesos per week. In six months, they could have enough money to leave the Philippines entirely, start fresh somewhere else, become the kind of people who ate at restaurants like this instead of hiding in corners of them.
"What happens if we say no?" Michelle asked.
Valdez's expression didn't change, but something shifted in the air around their table, a subtle chill that made Carl acutely aware of the other patrons in the bar, the way some of them seemed to be paying just a little too much attention to their conversation.
"Nothing happens," Valdez said simply. "You go back to your lives. Carl continues delivering pizza, you finish nursing school, and you both struggle to pay rent for the next decade while watching other people live the life you want. It's a perfectly valid choice."
The silence stretched between them, heavy with implications and possibilities. Carl could feel Michelle's eyes on him, could sense her trying to communicate something urgent through their connected hands. But the number kept echoing in his head: sixty-five thousand pesos per week.
"Can we think about it?" Carl asked.
"Of course. But not for long. Opportunities like this don't wait for people who can't make decisions." Valdez stood, straightening his expensive suit. "Rico will be in touch tomorrow. One way or another."
After they left, Carl and Michelle sat in silence on a bench outside the bar, watching traffic stream past in the neon-lit night. The city felt different now—more dangerous, but also more full of possibility.
"You know what he's really asking, right?" Michelle said finally.
"Yeah. I know."
"He's asking us to become criminals, Carl. Real criminals. Not just... whatever it is you've been doing with the packages."
Carl wanted to deny it, and wanted to find some rationalization that would make Valdez's offer sound less like a descent into darkness and more like a business opportunity. But Michelle was too smart, and he respected her too much to insult her intelligence.
"Sixty-five thousand pesos per week," he said instead.
"Blood money."
"Money that could change our lives."
"Money that could destroy our lives." Michelle turned to face him, her eyes bright with tears he hadn't expected. "Carl, I've been watching you these past few weeks. You think I don't notice the new clothes, the way you're never worried about bills anymore? You think I don't see how you look at rich people now not with envy, but with recognition, like you're becoming one of them?"
"Would that be so bad?"
"It would if it means becoming someone I don't recognize."
They argued in whispers there on the bench, their voices lost in the urban symphony of engines and sirens and the constant hum of eight million people living their lives. Michelle pleaded with Carl to walk away, to find another path, to remember who he'd been before money became the answer to every problem. Carl countered with practical arguments their families' needs, their limited options, the unfairness of a system that kept people like them poor while people like Valdez lived like kings.
But underneath the practical arguments was something else, something Carl couldn't quite articulate even to himself. For the first time in his life, someone powerful had looked at him and seen potential instead of just another face in the crowd. For the first time, he was being offered a seat at the table instead of being asked to serve the food.
It felt like respect. It felt like recognition. It felt like destiny.
"One job," he said finally. "We do one job, see what it's really like, make enough money to give us options. Then we decide."
Michelle was quiet for a long time, staring at the traffic lights changing from red to green to red again, an endless cycle that reminded her of choices that kept recurring until you either broke free or got trapped in the pattern.
"One job," she finally agreed. "But if it's as bad as I think it's going to be, we walk away. Promise me."
"I promise."
But even as Carl said the words, he could feel them hollow out in his mouth, becoming just sounds without substance. Because he already knew the truth that Michelle was still hoping to avoid: there was no such thing as "one job" in Valdez's world. There were only deeper waters, and once you started swimming, the current carried you wherever it wanted to go.

CHAPTER 3: THE POINT OF NO RETURN
The first job came two days later. A text message with an address in Parañaque and a time: midnight. Carl and Michelle rode through the sleeping suburbs on his motorcycle, both of them tense with anticipation and dread. The money, twenty-five thousand pesos each, as promised -- was motivation enough to get them there. What happened next would determine whether they ever went back.
The address led to a warehouse district, industrial and empty except for security lights that created islands of harsh illumination in an ocean of darkness. They found the specific building unmarked, unremarkable, with loading docks that had seen better decades.
Rico was waiting for them, along with two other men Carl didn't recognize. One was massive, built like a bouncer, with facial tattoos that suggested prison time. The other was thin and nervous, constantly checking his phone and glancing toward the shadows.
"Right on time," Rico said, but his usual casual demeanor was replaced by something more focused, more professional. "Carl, you're driving tonight. Michelle, there's a client inside who needs medical attention. Nothing complicated bullet wound, already stabilized, just needs cleaning and proper bandaging."
"Bullet wound?" Michelle's voice was tight. "Someone's been shot?"
"Occupational hazard," Rico said dismissively. "The client is conscious, cooperative, and paying well for discretion. Fifteen minutes of your time, fifteen thousand pesos in your pocket."
Carl felt the familiar rush of adrenaline that had become associated with these jobs, fear and excitement mixed in equal parts, the feeling of standing on the edge of a cliff and knowing you were about to jump.
They were led into the warehouse through a side door. The interior was mostly empty except for a makeshift medical area set up in one corner, a folding table, medical supplies, battery-powered lights. And lying on the table, conscious but pale, was a man Carl recognized.
Inspector Prince Delgado of the Philippine National Police.
Carl's blood turned to ice. He'd seen Prince's face in newspapers, on television, in stories about major drug busts and organized crime investigations. Prince was famous for being incorruptible, relentless, the kind of cop who made criminals lose sleep just by existing.
And now he was lying wounded in a warehouse, looking directly at Carl with eyes that missed nothing.
"Interesting," Prince said, his voice weaker than Carl had expected but still carrying authority. "I wouldn't have expected to see nursing students in a place like this."
Michelle had frozen at the sight of him, her medical bag clutched against her chest like a shield. "I... I can't treat a police officer. This is..."
"This is exactly what you're going to do," Rico said, and for the first time, his voice carried an edge of threat. "Unless you want to explain to Inspector Prince here how you ended up in this warehouse, knowing what you know about our operations."
The trap closed around them with the precision of a well-designed machine. They weren't just being hired to provide services they were being compromised, made complicit, tied to crimes they couldn't walk away from without destroying themselves.
"The wound isn't serious," Prince said, apparently unconcerned by the threat implicit in Rico's words. "Through and through, missed the major arteries. I've had worse."
"How did a police inspector end up shot in a drug dealer's warehouse?" Carl found himself asking.
Prince smiled, but it was a tired expression, full of knowledge that Carl couldn't yet understand. "That's a very good question, young man. One that might keep you awake at night if you're smart enough to think about it."
Michelle approached the table slowly, her medical training overriding her fear. She began examining the wound with professional competence, cleaning away dried blood and assessing the damage. "This needs proper medical attention. Hospital attention. I'm not equipped to"
"You're equipped enough," Rico interrupted. "Clean it, bandage it, give him something for the pain. That's all."
As Michelle worked, Carl found himself studying Prince's face, looking for clues about what kind of game they'd stumbled into. The inspector was in his early forties, with the kind of weathered features that came from years of police work. But there was something else there an intelligence that seemed to be cataloging every detail of their surroundings, every face in the room.
"What's your name, son?" Prince asked Carl.
"I... I don't think I should"
"Carl Santos," Rico said before Carl could finish. "And the lovely young lady is Michelle Cruz. Nursing student at FEU."
Prince nodded as if he were mentally filing the information away. "Carl Santos. Pizza delivery, motorcycle license, lives in Tondo with his mother and sister. Michelle Cruz, Dean's List student, works nights at a call center to pay for school."
The casual recitation of their personal information hit Carl like a physical blow. "How do you—"
"It's my job to know things," Prince said simply. "The question is, what are you two doing in a place like this? This doesn't seem like your usual crowd."
Before anyone could answer, the nervous man with the phone suddenly straightened. "We've got company," he hissed. "Three vehicles, moving fast, coming this way."
Rico cursed and pulled out his own phone, barking orders in rapid Tagalog. The big man with the tattoos was already moving toward a stack of wooden crates, pulling out automatic weapons that made Carl's knees go weak.
"Police?" Rico demanded.
"Can't tell. Could be rivals. Could be anybody." The nervous man was heading toward a back exit. "We need to move. Now."
"What about him?" Rico pointed toward Prince.
"Leave him. He's not going anywhere with that wound."
But Prince was already sitting up, swinging his legs off the table despite Michelle's protests. "Actually, I'm feeling much better. Amazing what proper medical attention can do."
The sound of vehicles screeching to a halt outside the warehouse cut through the night air. Car doors slamming, voices shouting orders, the unmistakable sound of armed men taking positions.
"Fuck," Rico muttered, then looked at Carl. "You know the back roads out of here?"
"Yeah, but"
"Then you're driving. All of us. Now."
What happened next would replay in Carl's nightmares for months to come. They ran through the warehouse toward a loading dock where a van was parked, Prince moving surprisingly well for someone who'd been shot. Behind them, the front of the building exploded inward as armed men in tactical gear burst through the entrance.
But these weren't police. Their movements were too chaotic, their shouts too uncoordinated. These were criminals, probably rivals trying to muscle in on Valdez's territory.
The van's engine roared to life as bullets began flying. Carl found himself behind the wheel, his hands shaking so badly he could barely grip the steering wheel. Michelle was in the passenger seat, her face white with terror. In the back, Rico and his men were returning fire through broken windows while Prince sat calmly in the corner, observing everything with professional interest.
"Drive!" Rico screamed, and Carl floored the accelerator.
They crashed through the loading dock door and into the night, tires screaming against asphalt. Behind them, the warehouse was lit up like a war zone, muzzle flashes strobing in the darkness. Carl took the first turn at dangerous speed, then another, navigating by instinct through industrial streets he'd learned during his delivery days.
"Where are we going?" he shouted over the gunfire.
"Just drive," Rico answered, reloading his weapon. "Get us out of here."
But even as Carl followed orders, his mind was racing with more important questions. What was a police inspector doing in a drug dealer's warehouse? Why had he been shot? And why did he seem so calm about everything that was happening?
The pieces of a larger puzzle were clicking together in Carl's head, forming a picture that terrified him more than the gunfight they'd just escaped.
Inspector Prince wasn't there as a victim.
He was there as a player.
And Carl and Michelle had just become pawns in a game they didn't understand, with rules they'd never learned, and stakes they couldn't even begin to calculate.
As they disappeared into the labyrinth of Manila's back streets, sirens wailing in the distance behind them, Carl realized that there would be no walking away from this. No going back to pizza delivery and nursing school and the simple problems of being poor but honest.
They had crossed a line tonight not just into criminality, but into something much more dangerous. They had become witnesses to secrets that powerful people would kill to protect.
And in the rearview mirror, Carl caught Inspector Prince's eyes watching him with an expression that might have been pity.
Or calculation.
The van's engine roared through the night, carrying them toward a future that none of them could escape.

At ang tunog ay papalapit.
Jeffrey ay lumingon sa paligid, naghahanap kung saan nanggagaling ang tawa. Ang kanyang flashlight ay nag-flicker, at sa maikling mga oras na ito, nakita niya ang mga anino sa mga dingding. Hindi lang mga anino mga hugis ng mga tao, mga kamay na umuunat, mga mata na nakatitig.
Tumakbo siya pababa, pero ang mga hagdan ay parang walang katapusan. Third floor, second floor, pero hindi niya maabot ang ground floor. Parang ang building ay nag-extend, naging mas malalim, mas malaki kaysa sa dati.
Ang tawa ay mas malakas na. Mas malapit.
At sa wakas, narinig niya ang boses ni Bryan, pero hindi sa radio. Nanggagaling sa ilalim, sa basement, sa pinakamalalim na parte ng Blackwood.
"Jeffrey! Tulong! May... may hindi tama dito! Ang mga pasyente... sila ay... oh God, sila ay..."
Naputol ang sigaw.
At sa katahimikan na sumunod, narinig ni Jeffrey ang pinakanakakatakot na tunog sa buong buhay niya.
Ang tunog ng mga yapak. Maraming yapak. Umuusad paakyat mula sa basement, patungo sa kanya.
Yapak na walang rhythm, walang pattern. Yapak na hindi tao.
Jeffrey ay huminto sa gitna ng stairwell, ang kanyang flashlight ay nag-off completely. Sa kadiliman, ang tanging naririnig niya ay ang kanyang mabilis na paghinga at ang patuloy na pagsisihan ng mga yapak.
Paparating na sila.
At alam ni Jeffrey na walang lugar na pwedeng tumakasan sa loob ng Blackwood.
Ang quiet night ay naging simula ng kanyang pinakamasarap na bangungot.

CHAPTER 1: THE NORMAL SHIFT
Alas-sais ng gabi, limang oras bago ang nightmare
"Ikaw na naman ang magdala ng kape ngayong gabi, Jeffrey," sabi ni Bryan Martinez habang naglalakad sila sa main entrance ng Blackwood Psychiatric Institution. Ang kanyang partner sa night shift ay isang matangkad na lalaki, may maitim na buhok na medyo mahaba na at palaging naka-ponytail. "Ako naman ang nagdala kahapon, at noong isang araw, at noong..."
"Oo na, oo na," putol ni Jeffrey sa kanya, ngumingiti. "Mayroong 7-Eleven na malapit dito, bibili na lang ako mamaya kapag nag-rounds tayo."
Pumasok sila sa building, ang kanilang mga ID badges ay nag-beep sa security scanner. Ang lobby ng Blackwood ay modernong-modernong tingnan—marble floors, malaking chandelier, mga paintings sa mga dingding na nagbibigay ng false sense of normalcy. Pero alam ni Jeffrey na kapag nakapasok ka na sa loob ng actual facility, ang atmosphere ay kakaiba na.
Si Margaret, ang receptionist sa night shift, ay nakaupo sa kanyang desk, nagbabasa ng romance novel habang nakain ang kanyang dinner.
"Good evening, boys," bati niya sa kanila. "Normal na shift na naman ba tayo ngayong gabi?"
"Sana," sagot ni Bryan. "Kamusta si Dr. Jacquelyn? Nandito pa ba siya?"

Jeffrey ay tumango. Kilala niya si Patterson isang dating construction worker na naging schizophrenic pagkatapos ng isang aksidente sa trabaho. Palagi siyang nagkukuwento tungkol sa mga kakaibang nilalang na nakikita niya sa mga sulok, mga shadows na gumagalaw kahit walang ilaw, mga boses na nagsasabi sa kanya ng mga bagay na hindi niya maintindihan.
"Mas mabuti na makipag-coordinate tayo sa kanya bago mag-start ang rounds," sabi ni Jeffrey. "Baka may special instructions siya para sa ibang pasyente."
Naglakad sila sa main corridor patungo sa elevator. Ang Blackwood ay may apat na palapag ground floor para sa administrative offices at common areas, second floor para sa mga low-risk patients, third floor para sa medium-risk, at fourth floor para sa mga high-risk cases. Ang basement ay ginagamit para sa storage, mechanical rooms, at ang old wing na hindi na ginagamit simula pa noong 1980s.
Sa elevator, nakakita sila ng kanilang reflection sa stainless steel na mga pinto. Jeffrey ay nakita ang sariling mukha may mga marka ng pagod sa mata, stubble sa pisngi, mga ugat sa leeg na nagpapakita ng stress mula sa trabaho. Si Bryan naman ay mas mukhang relaxed, pero may kakaibang expression sa mata, parang may iniisip na hindi niya masabi.
"Pre," sabi ni Bryan bigla, "nakakatakot ba sa'yo ang trabaho natin?"
Napalingon si Jeffrey sa kanya. "Ano bang klaseng tanong yan? Bakit mo naman naitanong?"
"Hindi ko alam," sagot ni Bryan, nakatingin pa rin sa reflection nila. "Minsan lang, lalo na kapag gabi na, parang... parang may kakaiba sa building na 'to. Hindi mo ba naramdaman?"
Jeffrey ay nag-isip. Totoo naman, may mga gabing nakakaramdam siya ng kakaibang atmosphere sa Blackwood. May mga oras na parang may nakatingin sa kanya mula sa mga sulok, may mga tunog na hindi niya maipaliwanag, may mga pangyayari na medyo out of ordinary.
"Siguro natural lang 'yon sa trabaho natin," sabi niya. "Nakakasama natin araw-araw ang mga taong may mental illness. Minsan nakakahawa ang kanilang perception ng reality."
Tumunog ang elevator second floor. Lumabas sila at naglakad patungo sa office ni Dr. Jacquelyn.
Dr. Jacquelyn Santos ay isa sa mga pinakagaling na psychiatrist sa buong Metro Manila. Thirty-five taong gulang, may long black hair na palaging naka-bun, matalinong mata na parang nakakakita ng mga bagay na hindi nakikita ng iba. Nagtrabaho siya sa Blackwood ng mahigit pitong taon na, at sa loob ng panahong iyon, naging expert siya sa paggamot ng mga pinakakomplikadong cases.
Kumatok si Jeffrey sa pinto ng office.
"Come in," ang boses ni Dr. Jacquelyn mula sa loob.
Pumasok sila sa office isang malaking silid na puno ng mga libro, diplomas sa mga dingding, at isang malaking desk na may maraming papel. Si Dr. Jacquelyn ay nakaupo sa kanyang swivel chair, nagbabasa ng isang thick folder.
"Jeffrey, Bryan," bati niya sa kanila. "Perfect timing. Kailangan nating pag-usapan ang ilang bagay tungkol sa mga pasyente ngayong gabi."
Umupo sila sa mga upuan sa harap ng desk niya.
"Una," simula ni Dr. Jacquelyn, "si Patterson sa Room 205. Naging mas aggressive siya ngayong mga nakaraang araw. Ang kanyang hallucinations ay naging mas vivid, mas detailed. Kanina, sinabi niya sa akin na nakikita niya ang mga 'shadow people' na nagpaplano ng isang 'big event' ngayong gabi."
"Big event?" tanong ni Bryan.

Jeffrey ay napakunot ng noo. "Doc, baka naman side effect lang ng medication niya? O kaya naman, stress from his condition?"
"Possible," sabi ni Dr. Jacquelyn, "pero may mga kakaiba ring nangyayari sa ibang pasyente. Si Mrs. Chen sa Room 315 ay hindi natulog ng dalawang gabi, nakaupo lang siya sa sulok ng kanyang kama, nakatingin sa pinto. Si Rodriguez sa Room 402 naman ay biglang naging tahimik hindi na siya nagsasalita o kumikibo kahit anong gawin namin."
Napatingin si Jeffrey kay Bryan. May expression sa mukha ng kaibigan niya na hindi niya mabasa.
"Doc," sabi ni Bryan, "ano sa tingin ninyo ang nangyayari?"
Dr. Jacquelyn ay nag-lean back sa kanyang chair. "Honestly? Hindi ko alam. Pwedeng coincidence, pwedeng may environmental factor na nakakaapekto sa kanila, o kaya naman..."
Hindi niya natapos ang sasabihin.
"O kaya naman ano, Doc?" tanong ni Jeffrey.
"O kaya naman may totoo sa sinasabi ni Patterson," sagot niya, pero ang tono niya ay half-joking lang. "Pero syempre, hindi naman tayo naniniwala sa mga ganung bagay, diba?"
Tumawa si Jeffrey, pero ang tawa niya ay medyo forced. "Syempre naman, Doc. Trabaho lang natin na mag-take care sa mga pasyente. Walang multo, walang mga kakaibang nilalang."
Pero sa loob-loob niya, may nagging feeling siya na may hindi tama sa gabi na ito.
"Anyway," patuloy ni Dr. Jacquelyn, "mag-ingat lang kayo sa rounds ninyo. Kung may kakaibang makikita o maririnig kayo, report ninyo agad sa akin. I'll be staying late tonight para mag-finish ng mga evaluation reports."
Tumayo sila at papalabas na ng office nang biglang tumunog ang intercom system ng buong building.
Static. Tapos ang boses ng security guard sa ground floor.
"Attention all staff. We are experiencing some technical difficulties with our electrical system. If you notice any flickering lights or power fluctuations, please report immediately to maintenance."
Napatingin sila sa isa't isa.
"Technical difficulties?" sabi ni Bryan. "Kakacheck lang naman ng maintenance team dito last week."
"Mga bagay na ganyan ay normal sa matatandang building," sabi ni Dr. Jacquelyn, pero may pag-aalala sa boses niya. "Blackwood ay mahigit tatlumpung taong gulang na. Minsan talaga may mga problema sa electrical system."
Lumabas sila ng office at nagsimula ng kanilang rounds. Ang normal na routine nila ay mag-check sa lahat ng patient rooms, siguraduhing nakalock ang mga pinto, nakabantay sa mga pasyenteng may tendency na maging violent, at magpatrol sa buong building every two hours.
Pero habang naglalakad sila sa second floor corridor, naramdaman ni Jeffrey na may kakaiba sa atmosphere. Ang mga ilaw ay medyo nag-flicker, ang air conditioning ay tumutunog ng mas malakas kaysa sa normal, at ang mga pasyente sa kanilang mga silid ay mas tahimik kaysa sa dati.
"Pre," bulong ni Bryan sa kanya, "tingnan mo ang mga pinto."
Napatingin si Jeffrey. Ang mga pinto ng patient rooms ay may mga maliit na windows para makita ng guards ang loob. Pero ngayon, ang mga windows ay parang may mga shadow na gumagalaw sa loob, mga hugis na hindi nila matukoy kung ano.
"Siguro mga pasyente lang na naglalakad sa loob ng kanilang mga silid," sabi ni Jeffrey, pero ang boses niya ay hindi convincing kahit sa sarili niya.
Nagsimula silang mag-check ng mga silid. Room 201 si Mr. Delgado, isang dating teacher na naging bipolar. Natutulog siya sa kanyang kama, pero ang posisyon niya ay kakaiba. Nakadapa siya, ang mukha ay nakasubsob sa unan, ang mga kamay ay nakaflat sa gilid ng katawan. Hindi natural na sleeping position.
Room 202 si Ms. Valdez, isang babaeng may severe depression. Nakaupo siya sa floor sa gitna ng silid, nakatingin sa ceiling, ang mga mata ay nakabukas ng malaki pero parang walang nakikita.
Room 203 si Mr. Santos, isang lalaking may paranoid schizophrenia. Nakatayo siya sa may pinto, nakatingin direkta sa window kung saan nakatingin si Jeffrey. Ang mga mata niya ay walang expression, pero may nakangiting labi.
"Putangina," bulong ni Jeffrey. "Bakit parang lahat sila ay..."
Hindi niya natapos ang sasabihin niya dahil biglang namatay ang mga ilaw sa buong corridor.
Emergency lighting ay nag-activate, pero ang red na ilaw ay nagbibigay ng eerie na atmosphere sa pasilyo. Ang mga anino ay naging mas malalim, mas malaking, at parang may mga mata na nakatingin sa kanila mula sa kadiliman.
"Jeffrey," bulong ni Bryan, ang boses niya ay puno ng takot. "Ano 'yun?"
Sa dulo ng corridor, may isang figure na nakatayo. Hindi nila makita ang mukha dahil sa kadiliman, pero ang hugis ay tao matangkad, payat, at parang nakatingin sa kanila.
"Sino 'yun?" tanong ni Jeffrey, kumuha ng flashlight mula sa kanyang belt.
Pero nang i-on niya ang flashlight at i-direct sa figure, wala na roon.
Ang corridor ay empty, maliban sa kanila.
Pero ang feeling na may nakatingin sa kanila ay hindi nawala.
At sa basement, sa pinakamalalim na parte ng Blackwood, may mga tunog na nagsisimula nang marinig.
Mga tunog na hindi dapat nanggagaling sa mga pasyente.
Mga tunog na hindi tao.
Ang quiet night ay nagsisimula na.

CHAPTER 2: SIGURADO BA KAYONG NAKITA NINYO 'YUN?
Tatlong minuto pagkatapos ng blackout, bumalik ang normal lighting sa second floor corridor. Ang mga fluorescent lights ay nag-flicker pa ng ilang segundo bago tuluyang mag-stabilize, at ang humming sound ng air conditioning system ay bumalik sa normal na frequency.
Jeffrey at Bryan ay nanatiling nakatayo sa gitna ng pasilyo, ang kanilang mga mata ay nananatiling nakatingin sa dulo ng corridor kung saan nakita nila ang mysterious figure. Ang emergency lighting ay patay na, pero ang red na glow na naiwan sa kanilang retina ay parang nagbibigay pa rin ng eerie na feeling sa buong area.
"Pre," bulong ni Bryan, ang kanyang boses ay medyo nangangatal pa, "nakita mo rin ba 'yun? 'Yung tao sa dulo?"
Jeffrey ay hindi agad sumagot. Ang kanyang flashlight ay nakahawak pa rin sa kamay, nakapat pa rin yung on/off switch, pero hindi niya magawang i-off. May parte sa kanya na ayaw bumalik sa kadiliman, kahit alam niyang bumalik na ang mga ilaw.

Naglakad sila patungo sa dulo ng corridor, sa exact spot kung saan nakita nila ang figure. Ang floor ay normal lang walang footprints, walang bakas na may nakatayo doon. Ang mga dingding ay pareho pa rin, walang mga scratch marks o anomalya. Pero may kakaibang amoy sa hangin, parang combination ng disinfectant at something metallic, parang dugo.

Pumunta sila sa nurse station sa gitna ng second floor. Ang computer terminals ay lahat working, pero ang monitors na dapat nagdidisplay ng patient vital signs ay nagshishow lang ng static. Ang communication system na dapat connected sa lahat ng floors ay tumutunog lang ng white noise.
Si Nurse Catherine ay nakaupo sa station, nagbabasa ng patient charts, pero ang expression niya ay medyo confused.
"Nurse Catherine," tawag ni Jeffrey. "Kamusta ang mga pasyente? May mga naging aggressive ba after ng blackout?"
Tiningnan siya ni Nurse Catherine, pero ang tingin niya ay parang hindi siya nakikilala. Ang mga mata niya ay medyo glassy, parang nasa trance.
"Mga pasyente?" tanong niya, ang boses niya ay monotone. "Lahat sila ay natutulog. Lahat sila ay okay. Walang problema."
"Sigurado ka?" tanong ni Bryan. "Kanina kasi, before ng blackout, nakita namin sa mga rooms na may kakaibang behavior sila."
"Natutulog lahat," ulit ni Nurse Catherine, bumalik ang tingin niya sa charts na binabasa. "Walang problema. Tahimik ang lahat."
Napatingin si Jeffrey kay Bryan. May kakaiba sa behavior ni Nurse Catherine. Normally, ang nurse na ito ay very talkative, palaging nagkukuwento tungkol sa kanyang family, sa mga pasyente, sa mga pangyayari sa ospital. Pero ngayon, parang robot na nagsasalita.
"Nurse," sabi ni Jeffrey, mas malapit na sa kanya, "okay ka ba? Parang... parang iba ka ngayong gabi."
Tiningnan siya ulit ni Nurse Catherine, pero ang tingin niya ay parang tumatagos sa kanya, parang nakatingin sa isang bagay na nasa likod niya.
"Ako ay okay," sagot niya. "Lahat tayo ay okay. Ang gabi ay tahimik. Ang lahat ay normal."
Lumabas sila ng nurse station, hindi na nakakuha ng meaningful information.
"Pre," bulong ni Bryan, "may kakaiba sa kanya. Hindi ko alam kung ano, pero parang... parang hindi siya ang mismo si Nurse Catherine."
"Noted," sabi ni Jeffrey. "Pero kailangan natin mag-continue sa rounds. Baka may iba pang staff na pwede nating makausap."
Nagsimula silang mag-check ulit ng mga patient rooms, pero ang mga nakita nila ay mas nakakatakot pa sa nakita nila kanina.
Room 201 - si Mr. Delgado ay nasa exactly same position pa rin. Nakadapa sa kama, ang mukha ay nakasubsob sa unan, ang mga kamay ay nakaflat sa gilid. Pero ngayon, nakita nila na ang kanyang mga daliri ay gumagalaw slightly, parang nag-ttype sa invisible keyboard.
Room 202 - si Ms. Valdez ay nakaupo pa rin sa floor, nakatingin sa ceiling. Pero ang kanyang mga labi ay gumagalaw na, parang nag-mumble ng mga salita na hindi nila marinig.
Room 203 - si Mr. Santos ay nakatayo pa rin sa may pinto, nakatingin sa window. Pero ngayon, ang kanyang smile ay mas malawak na, at nakita nila na ang kanyang mga mata ay completely black. Walang iris, walang pupil. Pure black.
"Tangina," bulong ni Jeffrey. "Anong nangyayari sa mga pasyente?"
Pero bago pa siya makapagtanong pa, narinig nila ang tunog ng intercom system na nag-activate ulit.
Static. Tapos ang boses, pero hindi ang boses ng security guard. Ang boses na ito ay mas malalim, mas nakakagulat, at parang nanggagaling sa mataas na lugar.
"Attention all staff," ang boses ay medyo distorted, parang may interference. "Please proceed to the basement level for mandatory emergency meeting. All staff members are required to attend. This is not a drill."
Nakatayo sila sa corridor, nakikinig sa announcement. Pero may kakaiba sa boses. Hindi ito ang normal na announcement style ng Blackwood administration.

Natunog ulit ang intercom.
"All staff members who do not comply will face disciplinary action. Please proceed to basement level immediately. The meeting will commence in ten minutes."
Pagkatapos ng announcement, bumalik ang katahimikan sa corridor. Pero ang katahimikang ito ay mas nakakatakot pa sa dati. Parang ang building mismo ay naghihintay ng something.
"Bababa ba tayo?" tanong ni Bryan.
Jeffrey ay nag-isip. Sa loob ng sampung taon niya sa Blackwood, hindi pa siya nakatanggap ng ganong announcement. At lalo na hindi sa basement. Ang basement ay ginagamit lang para sa storage at mechanical equipment. Walang meeting room doon, walang conference area.
"Teka," sabi niya, kinuha ang radio niya. "Dr. Jacquelyn, nandito ka pa ba sa office mo?"
Static lang ang sumagot.
"Dr. Jacquelyn, may narinig ba kayong announcement tungkol sa emergency meeting sa basement?"
Static pa rin.
"Pati radio system ay may problema na," sabi ni Bryan. "Jeffrey, parang lahat ng communication sa building ay cut off na."
Naglakad sila patungo sa nurse station ulit para kausapin si Nurse Catherine, pero nang makarating sila doon, ang station ay empty na. Ang mga patient charts ay naka-scatter sa desk, ang computer monitors ay nagdishow na ng blue screen, at ang upuan ni Nurse Catherine ay gumugulong pa, parang kakaalis lang niya.
"Saan napunta si Nurse Catherine?" tanong ni Bryan.
Sa floor, nakita nila ang mga footprints na papunta sa direction ng stairwell. Pero ang footprints ay kakaiba mas malaki kaysa sa normal na sapatos, at ang pattern ay hindi human. May mga markings na parang claws o kaya naman may kasamang ibang creature na naglalakad kasama niya.

At lahat ng mga prints ay hindi normal.
Sa stairwell, narinig nila ang mga tunog mula sa basement. Hindi ang normal na humming ng mechanical equipment. Ang mga tunog na ito ay parang... parang mga boses. Maraming boses na nag-chant ng isang hindi maintindihang language.

Maraming footsteps. At hindi lahat ay tao.

Ang mga footsteps sa basement ay mas malakas na. Papalapit na sa ground floor.

Tumakbo sila patungo sa supply closet sa dulo ng second floor corridor. Sa loob ng closet, kasama nila ang mga cleaning supplies, medical equipment, at iba pang gamit ng hospital. May maliit na ventilation grate sa itaas na pwede nilang pagmultihan ng mga tunog mula sa ibang parts ng building.
Sa loob ng closet, nakaupo sila sa floor, nakikinig sa mga tunog na nanggagaling sa buong building. Ang chanting sa basement ay mas organized na, mas malakas. At narinig nila ang mga footsteps na umakyat na sa ground floor, papunta sa second floor.
"Jeffrey," bulong ni Bryan sa tenga niya, "ano sa tingin mo ang nangyayari sa Blackwood ngayong gabi?"
"Hindi ko alam," sagot ni Jeffrey. "Pero sigurado ako na hindi ito normal na psychiatric emergency. May kakaibang nangyayari dito, at lahat ng staff at pasyente ay involved."
Narinig nila ang mga footsteps sa second floor corridor na. Multiple footsteps, maraming tao na naglalakad sa labas ng closet. Pero ang weird thing ay, ang mga footsteps ay walang variation sa rhythm. Lahat ay naglalakad ng exactly same pace, same pattern. Parang mga robot o kaya naman parang controlled ng isang entity.
Sa ventilation grate, narinig nila ang mga boses.
"Room 201... check."
"Room 202... check."
"Room 203... check."
Ang mga boses ay monotone, walang emotion. At nakilala nila ang mga boses – sina Mr. Delgado, Ms. Valdez, Mr. Santos. Ang mga pasyente na nakita nila kanina sa kanilang mga rooms.
